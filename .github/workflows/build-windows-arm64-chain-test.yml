name: fengwo-windows-arm64-chain-test-package
run-name: New unsigned Windows ARM64 chain UI package · ${{ github.sha }}

on:
  push:
    branches:
      - 'codex/windows-arm64-chain-ui-check-*'

permissions:
  contents: read

concurrency:
  group: new-chain-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      FENGWO_PROXY_MUTATING_TEST: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout isolated new product source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Bootstrap native pinned Flutter
        shell: pwsh
        run: |
          git config --global core.longpaths true
          ./tooling/windows/arm64/prepare_flutter.ps1 -SdkDirectory (Join-Path $env:RUNNER_TEMP 'flutter-arm64-3.44.4') -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'arm64-evidence/toolchain')

      - name: Setup native Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          architecture: arm64
          cache-dependency-path: core/go.sum

      - name: Setup fixture Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64

      - name: Verify native Rust and select the installed Visual Studio generator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rust = rustc -Vv | Out-String
          if ($LASTEXITCODE -ne 0 -or $rust -notmatch '(?m)^host: aarch64-pc-windows-msvc\s*$') { throw 'Native ARM64 MSVC Rust toolchain is required' }
          $rust | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'arm64-evidence/toolchain/rust.txt') -Encoding UTF8
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = (& $vswhere -latest -products '*' -format json | ConvertFrom-Json)[0]
          if (-not $installation) { throw 'Visual Studio is unavailable' }
          $major = ([version]$installation.installationVersion).Major
          $generator = switch ($major) { 17 { 'Visual Studio 17 2022' }; 18 { 'Visual Studio 18 2026' }; default { throw 'Unsupported Visual Studio generator' } }
          ('FENGWO_ARM64_CMAKE_GENERATOR=' + $generator) | Add-Content -LiteralPath $env:GITHUB_ENV
          $ninja = Join-Path $installation.installationPath 'Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path -LiteralPath $ninja -PathType Leaf)) { throw 'Ninja is required for native build tool tests' }
            (Split-Path -Parent $ninja) | Add-Content -LiteralPath $env:GITHUB_PATH
          }
          $gitRoot = Split-Path -Parent (Split-Path -Parent (Get-Command git).Source)
          $gitBash = Join-Path $gitRoot 'bin/bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) { throw 'Git Bash is required for setup shell checks' }
          (Split-Path -Parent $gitBash) | Add-Content -LiteralPath $env:GITHUB_PATH
          ('FENGWO_SETUP_TEST_BASH=' + $gitBash) | Add-Content -LiteralPath $env:GITHUB_ENV
          . ./tooling/windows/arm64/common.ps1
          $sourceFiles = @(git ls-files -- .github/workflows/package-windows-arm64.yml tooling/windows/arm64 tooling/windows/prepare_arm64_javascript.ps1 tooling/windows/quickjs_bridge tooling/windows/test_prepare_arm64_javascript.ps1 tooling/windows/test_vc_runtime_installer.ps1 tooling/windows/verify_vc_runtime_bundle.ps1 tooling/windows/test_vc_runtime_bundle.ps1 setup.dart test/setup_test.dart test/windows_runtime_bundle_test.dart plugins/setup/buildkit plugins/proxy windows/CMakeLists.txt windows/packaging windows/runner/Runner.rc plugins/setup/windows services/helper lib/common lib/main.dart lib/manager/proxy_manager.dart test/common test/core test/manager/proxy_manager_test.dart)
          $sourceManifest = @($sourceFiles | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() } })
          Save-FwArmEvidence (Join-Path $env:RUNNER_TEMP 'arm64-evidence/source-manifest.json') ([ordered]@{ source_sha = $env:GITHUB_SHA; files = $sourceManifest })
          Save-FwArmEvidence (Join-Path $env:RUNNER_TEMP 'arm64-evidence/toolchain/compiler.json') ([ordered]@{ generator = $generator; installation_version = $installation.installationVersion; installation_path = $installation.installationPath; go = (& go version | Out-String).Trim(); cmake = (& cmake --version | Out-String).Trim() })
          ./tooling/windows/arm64/test_webview_coroutines.ps1 -Generator $generator -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'arm64-evidence/webview-coroutines')
      - name: Record source and prepare pinned native packaging
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tooling/windows/arm64/common.ps1
          $environment = Assert-FwNativeRunner -Architecture arm64
          $evidence = Join-Path $env:RUNNER_TEMP 'new-chain-evidence'
          [void][IO.Directory]::CreateDirectory($evidence)
          $files = @(git ls-files -- lib test core plugins/setup services/helper windows tooling/windows .github/workflows/build-windows-arm64-chain-test.yml)
          if ($LASTEXITCODE -ne 0) { throw 'Source manifest enumeration failed' }
          $manifest = @($files | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() } })
          Save-FwArmEvidence (Join-Path $evidence 'source-manifest.json') ([ordered]@{ source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; files = $manifest; unsigned_test_only = $true; environment = $environment })

      - name: Restore pinned native ARM64 packaging and Javascript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependencies failed' }
          ./tooling/windows/prepare_arm64_javascript.ps1 -ProjectRoot $PWD -CmakePath (Get-Command cmake).Source -Generator $env:FENGWO_ARM64_CMAKE_GENERATOR -Configuration Release
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 package overrides failed' }
          Copy-Item -LiteralPath .dart_tool/windows_arm64_javascript/manifest.json -Destination (Join-Path $env:RUNNER_TEMP 'arm64-evidence/quickjs-native-manifest.json')
          Copy-Item -LiteralPath .dart_tool/windows_arm64_javascript/build/Testing/Temporary/LastTest.log -Destination (Join-Path $env:RUNNER_TEMP 'arm64-evidence/quickjs-native-ctest.log')
          ./tooling/windows/test_prepare_arm64_javascript.ps1
          $env:PATH = (Join-Path $PWD '.dart_tool/windows_arm64_javascript/build/Release') + [IO.Path]::PathSeparator + $env:PATH
          flutter test --no-pub --reporter expanded --timeout=30s tooling/windows/quickjs_bridge/runtime_smoke_test.dart | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'arm64-evidence/quickjs-dart-ffi-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Actual ARM64 Dart FFI Javascript smoke failed' }
          dart pub global activate -s git https://github.com/chen08209/flutter_distributor.git --git-ref c30ce409bef798c4f5fcedc45293eb4bc33da597 --git-path packages/flutter_distributor
          if ($LASTEXITCODE -ne 0) { throw 'Pinned packaging tool failed' }
          $fengwoPackageCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Pub/Cache' }
          $fengwoPackageBin = Join-Path $fengwoPackageCache 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $fengwoPackageBin 'flutter_distributor.bat') -PathType Leaf)) { throw 'The activated packaging launcher is missing' }
          $fengwoPackageBin | Add-Content -LiteralPath $env:GITHUB_PATH
          Push-Location plugins/setup/buildkit/build_tool
          try {
            dart pub get
            if ($LASTEXITCODE -ne 0) { throw 'Build tool dependencies failed' }
          } finally { Pop-Location }
          dart tooling/apply_core_patches.dart
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Core patch preparation failed' }

      - name: Verify real chain entry and hot-application regressions
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'new-chain-evidence'
          flutter analyze --no-pub --no-fatal-infos | Tee-Object -FilePath (Join-Path $evidence 'analyze.txt')
          if ($LASTEXITCODE -ne 0) { throw 'New chain source analysis failed' }
          flutter test --no-pub --reporter expanded test/common/chain_proxy_test.dart test/common/chain_proxy_validation_test.dart test/providers/chain_proxy_apply_test.dart test/widgets/chain_proxy_dialog_test.dart test/core/transport_test.dart test/manager/core_manager_test.dart tooling/windows/real/chain_config_generation_test.dart | Tee-Object -FilePath (Join-Path $evidence 'chain-focused-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw 'New chain business and generated-config regressions failed' }
          python -m unittest discover -s tooling/windows/real -p '*_test.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Strict two-hop fixture verification failed' }

      - name: Prepare remote configuration build keys
        env:
          AES_KEY: ${{ secrets.REMOTE_CONFIG_AES_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.REMOTE_CONFIG_SIGNING_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AES_KEY) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PUBLIC_KEY)) { throw 'Remote build configuration keys are required' }
          [void][IO.Directory]::CreateDirectory((Join-Path $PWD 'tooling/remote_config'))
          $keys = @{ aesKey = $env:AES_KEY; signingPublicKey = $env:SIGNING_PUBLIC_KEY } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD 'tooling/remote_config/keys.json'), $keys, [Text.UTF8Encoding]::new($false))

      - name: Build the new unsigned ARM64 test installer
        id: build
        run: |
          dart setup.dart windows --arch arm64 --env stable --targets exe
          if ($LASTEXITCODE -ne 0) { throw 'New chain test packaging failed' }
          $installers = @(Get-ChildItem dist -Filter '*windows*.exe' -File)
          if ($installers.Count -ne 1 -or (Get-AuthenticodeSignature -LiteralPath $installers[0].FullName).Status -cne 'NotSigned') { throw 'Exactly one unsigned test installer is required' }
          Rename-Item -LiteralPath $installers[0].FullName -NewName 'fengwo-windows-arm64-chain-test-unsigned.exe'
          . ./tooling/windows/arm64/common.ps1
          $installer = Get-Item dist/fengwo-windows-arm64-chain-test-unsigned.exe
          $bundle = Join-Path $PWD 'build/windows/arm64/runner/Release'
          ./tooling/windows/verify_vc_runtime_bundle.ps1 -Architecture arm64 -BundleDirectory $bundle
          ./tooling/windows/arm64/verify_bundle.ps1 -BundleDirectory $bundle -InstallerPath $installer.FullName -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'new-chain-evidence/native-package')
          foreach ($name in @('FengWo.exe', 'FengWoCore.exe', 'FengWoHelperService.exe')) {
            if (-not (Get-FwPeIdentity (Join-Path $bundle $name)).arm64) { throw ('The test payload was not native ARM64: ' + $name) }
          }
          $coreHash = (Get-FileHash -LiteralPath (Join-Path $bundle 'FengWoCore.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content -LiteralPath (Join-Path $bundle 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.coreSha256 -cne $coreHash) { throw 'The packaged Core hash did not match its integrity manifest' }
          Save-FwArmEvidence (Join-Path $env:RUNNER_TEMP 'new-chain-evidence/package.json') ([ordered]@{ source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; architecture = 'arm64'; installer_name = $installer.Name; installer_sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); installer_bytes = $installer.Length; core_sha256 = $coreHash; unsigned_test_only = $true; digitally_signed = $false; customer_account_uploaded = $false; real_gui_chain_tested = $false })

      - name: Install and exercise the new packaged Core chain
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'new-chain-evidence'
          $bundle = Join-Path $env:RUNNER_TEMP 'new-chain-installed'
          $process = Start-Process -FilePath (Join-Path $PWD 'dist/fengwo-windows-arm64-chain-test-unsigned.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR=' + $bundle), '/TASKS=', ('/LOG=' + (Join-Path $evidence 'installation.log'))) -PassThru
          if (-not $process.WaitForExit(120000) -or $process.ExitCode -ne 0) { throw 'The new test installer did not complete normally' }
          $package = Get-Content -LiteralPath (Join-Path $evidence 'package.json') -Raw | ConvertFrom-Json
          if ((Get-FileHash -LiteralPath (Join-Path $bundle 'FengWoCore.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $package.core_sha256) { throw 'The actual installed Core differed from the new package payload' }
          ./tooling/windows/real/test_chain_native.ps1 -Architecture arm64 -BundleDirectory $bundle -EvidenceDirectory (Join-Path $evidence 'native-chain')

      - name: Remove only the isolated test installation and local build key files
        if: always()
        run: |
          $uninstaller = Join-Path $env:RUNNER_TEMP 'new-chain-installed/unins000.exe'
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            $process = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG=' + (Join-Path $env:RUNNER_TEMP 'new-chain-evidence/uninstallation.log'))) -PassThru
            if (-not $process.WaitForExit(120000) -or $process.ExitCode -ne 0) { throw 'The isolated new package did not uninstall normally' }
          }
          foreach ($path in @('env.json', 'tooling/remote_config/keys.json')) {
            if (Test-Path -LiteralPath $path -PathType Leaf) { Remove-Item -LiteralPath $path -Force }
          }

      - name: Upload only synthetic evidence and the unsigned test installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-windows-arm64-chain-test-unsigned-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/new-chain-evidence
            ${{ runner.temp }}/arm64-evidence
            dist/fengwo-windows-arm64-chain-test-unsigned.exe
          if-no-files-found: error
          retention-days: 7
