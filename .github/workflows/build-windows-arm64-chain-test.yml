name: fengwo-windows-arm64-chain-test-package
run-name: Windows ARM64 1.0.9 stable release snapshot · ${{ github.sha }}

on:
  push:
    branches:
      - 'codex/windows-arm64-release-snapshot-109-20261012'

permissions:
  actions: read
  contents: read

concurrency:
  group: new-chain-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-11-arm
    timeout-minutes: 90
    env:
      FENGWO_PROXY_MUTATING_TEST: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact committed source bytes
        run: git config --global core.autocrlf false

      - name: Checkout isolated new product source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Bootstrap native pinned Flutter
        shell: pwsh
        run: |
          git config --global core.longpaths true
          ./tooling/windows/arm64/prepare_flutter.ps1 -SdkDirectory (Join-Path $env:RUNNER_TEMP 'flutter-arm64-3.44.4') -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'arm64-evidence/toolchain')

      - name: Setup native Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          architecture: arm64
          cache-dependency-path: core/go.sum

      - name: Setup fixture Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64

      - name: Verify native Rust and select the installed Visual Studio generator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rust = rustc -Vv | Out-String
          if ($LASTEXITCODE -ne 0 -or $rust -notmatch '(?m)^host: aarch64-pc-windows-msvc\s*$') { throw 'Native ARM64 MSVC Rust toolchain is required' }
          $rust | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'arm64-evidence/toolchain/rust.txt') -Encoding UTF8
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = (& $vswhere -latest -products '*' -format json | ConvertFrom-Json)[0]
          if (-not $installation) { throw 'Visual Studio is unavailable' }
          $major = ([version]$installation.installationVersion).Major
          $generator = switch ($major) { 17 { 'Visual Studio 17 2022' }; 18 { 'Visual Studio 18 2026' }; default { throw 'Unsupported Visual Studio generator' } }
          ('FENGWO_ARM64_CMAKE_GENERATOR=' + $generator) | Add-Content -LiteralPath $env:GITHUB_ENV
          $ninja = Join-Path $installation.installationPath 'Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path -LiteralPath $ninja -PathType Leaf)) { throw 'Ninja is required for native build tool tests' }
            (Split-Path -Parent $ninja) | Add-Content -LiteralPath $env:GITHUB_PATH
          }
          $gitRoot = Split-Path -Parent (Split-Path -Parent (Get-Command git).Source)
          $gitBash = Join-Path $gitRoot 'bin/bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) { throw 'Git Bash is required for setup shell checks' }
          (Split-Path -Parent $gitBash) | Add-Content -LiteralPath $env:GITHUB_PATH
          ('FENGWO_SETUP_TEST_BASH=' + $gitBash) | Add-Content -LiteralPath $env:GITHUB_ENV
          . ./tooling/windows/real/release_common.ps1
          $sourceFiles = @(git ls-files -- .github/workflows/package-windows-arm64.yml tooling/windows/arm64 tooling/windows/prepare_arm64_javascript.ps1 tooling/windows/quickjs_bridge tooling/windows/test_prepare_arm64_javascript.ps1 tooling/windows/test_vc_runtime_installer.ps1 tooling/windows/verify_vc_runtime_bundle.ps1 tooling/windows/test_vc_runtime_bundle.ps1 setup.dart test/setup_test.dart test/windows_runtime_bundle_test.dart plugins/setup/buildkit plugins/proxy windows/CMakeLists.txt windows/packaging windows/runner/Runner.rc plugins/setup/windows services/helper lib/common lib/main.dart lib/manager/proxy_manager.dart test/common test/core test/manager/proxy_manager_test.dart)
          $sourceManifest = @($sourceFiles | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() } })
          Save-FwArmEvidence (Join-Path $env:RUNNER_TEMP 'arm64-evidence/source-manifest.json') ([ordered]@{ source_sha = $env:GITHUB_SHA; files = $sourceManifest })
          Save-FwArmEvidence (Join-Path $env:RUNNER_TEMP 'arm64-evidence/toolchain/compiler.json') ([ordered]@{ generator = $generator; installation_version = $installation.installationVersion; installation_path = $installation.installationPath; go = (& go version | Out-String).Trim(); cmake = (& cmake --version | Out-String).Trim() })
          ./tooling/windows/arm64/test_webview_coroutines.ps1 -Generator $generator -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'arm64-evidence/webview-coroutines')
      - name: Record source and prepare pinned native packaging
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tooling/windows/real/release_common.ps1
          $environment = Assert-FwNativeRunner -Architecture arm64
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-109-evidence'
          [void][IO.Directory]::CreateDirectory($evidence)
          $files = @(git ls-files -- lib test core plugins/setup services/helper windows tooling/windows .github/workflows/build-windows-arm64-chain-test.yml)
          if ($LASTEXITCODE -ne 0) { throw 'Source manifest enumeration failed' }
          $sourceLock = Get-Content -LiteralPath './tooling/windows/real/release-source-lock.json' -Raw | ConvertFrom-Json
          if ($sourceLock.architecture -cne 'arm64' -or $sourceLock.desktop_default_port -ne 17980 -or $sourceLock.new_helper_port -ne 47907 -or -not $sourceLock.stable_build) { throw 'The stable release source lock differs' }
          foreach ($source in $sourceLock.files) {
            if (-not (Test-Path -LiteralPath $source.path -PathType Leaf) -or (Get-FileHash -LiteralPath $source.path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $source.sha256) { throw ('Frozen release source changed: ' + $source.path) }
          }
          Save-FwArmEvidence (Join-Path $evidence 'release-source-lock.json') $sourceLock
          $manifest = @($files | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() } })
          Save-FwArmEvidence (Join-Path $evidence 'source-manifest.json') ([ordered]@{ source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; files = $manifest; unsigned_test_only = $false; stable_build = $true; release_sequence = 2026101209; environment = $environment })

      - name: Restore pinned native ARM64 packaging and Javascript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependencies failed' }
          ./tooling/windows/prepare_arm64_javascript.ps1 -ProjectRoot $PWD -CmakePath (Get-Command cmake).Source -Generator $env:FENGWO_ARM64_CMAKE_GENERATOR -Configuration Release
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 package overrides failed' }
          Copy-Item -LiteralPath .dart_tool/windows_arm64_javascript/manifest.json -Destination (Join-Path $env:RUNNER_TEMP 'arm64-evidence/quickjs-native-manifest.json')
          Copy-Item -LiteralPath .dart_tool/windows_arm64_javascript/build/Testing/Temporary/LastTest.log -Destination (Join-Path $env:RUNNER_TEMP 'arm64-evidence/quickjs-native-ctest.log')
          ./tooling/windows/test_prepare_arm64_javascript.ps1
          $env:PATH = (Join-Path $PWD '.dart_tool/windows_arm64_javascript/build/Release') + [IO.Path]::PathSeparator + $env:PATH
          flutter test --no-pub --reporter expanded --timeout=30s tooling/windows/quickjs_bridge/runtime_smoke_test.dart | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'arm64-evidence/quickjs-dart-ffi-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Actual ARM64 Dart FFI Javascript smoke failed' }
          dart pub global activate -s git https://github.com/chen08209/flutter_distributor.git --git-ref c30ce409bef798c4f5fcedc45293eb4bc33da597 --git-path packages/flutter_distributor
          if ($LASTEXITCODE -ne 0) { throw 'Pinned packaging tool failed' }
          $fengwoPackageCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Pub/Cache' }
          $fengwoPackageBin = Join-Path $fengwoPackageCache 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $fengwoPackageBin 'flutter_distributor.bat') -PathType Leaf)) { throw 'The activated packaging launcher is missing' }
          $fengwoPackageBin | Add-Content -LiteralPath $env:GITHUB_PATH
          Push-Location plugins/setup/buildkit/build_tool
          try {
            dart pub get
            if ($LASTEXITCODE -ne 0) { throw 'Build tool dependencies failed' }
          } finally { Pop-Location }
          dart tooling/apply_core_patches.dart
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Core patch preparation failed' }

      - name: Verify real chain entry and hot-application regressions
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-109-evidence'
          flutter analyze --no-pub --no-fatal-infos | Tee-Object -FilePath (Join-Path $evidence 'analyze.txt')
          if ($LASTEXITCODE -ne 0) { throw 'New chain source analysis failed' }
          flutter test --no-pub --reporter expanded test/common/chain_proxy_test.dart test/common/chain_proxy_validation_test.dart test/providers/chain_proxy_apply_test.dart test/widgets/chain_proxy_dialog_test.dart test/core/transport_test.dart test/manager/core_manager_test.dart test/core/desktop/helper_client_test.dart test/providers/windows_tun_authorization_test.dart test/common/windows_identity_test.dart test/providers/startup_tun_intent_test.dart test/providers/startup_setup_regression_test.dart test/providers/action_test.dart test/providers/windows_connection_test.dart test/providers/macos_authorization_update_regression_test.dart test/common/mixed_port_test.dart test/common/migration_test.dart test/common/preferences_test.dart test/common/windows_upgrade_startup_test.dart test/widgets/advanced_settings_test.dart test/widgets/views_smoke_test.dart tooling/windows/real/chain_config_generation_test.dart | Tee-Object -FilePath (Join-Path $evidence 'chain-focused-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw 'New chain business and generated-config regressions failed' }
          python -m unittest discover -s tooling/windows/real -p '*_test.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Strict two-hop fixture verification failed' }

      - name: Verify complete required Flutter and plugin regressions
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-109-evidence'
          flutter test --no-pub --reporter expanded test plugins/proxy/test/proxy_test.dart plugins/proxy/test/proxy_result_test.dart plugins/proxy/test/macos_service_proxy_test.dart plugins/proxy/test/windows_proxy_repair_test.dart | Tee-Object -FilePath (Join-Path $evidence 'flutter-required-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Required release regressions failed' }
          ./tooling/windows/test_prepare_vc_runtime.ps1 | Tee-Object -FilePath (Join-Path $evidence 'runtime-preparation-tests.txt')
          ./tooling/windows/test_vc_runtime_bundle.ps1 | Tee-Object -FilePath (Join-Path $evidence 'runtime-bundle-tests.txt')

      - name: Compile and verify native installer policies before the product build
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-109-evidence'
          ./tooling/windows/test_vc_runtime_installer.ps1 6>&1 | Tee-Object -FilePath (Join-Path $evidence 'installer-prerequisite-tests.txt')
          ./tooling/windows/test_integrity_installer.ps1 -OutputDirectory (Join-Path $evidence 'installer-integrity')

      - name: Apply pinned Core patches and verify Windows Helper
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-109-evidence'
          Push-Location plugins/setup/buildkit/build_tool
          try {
            dart pub get
            if ($LASTEXITCODE -ne 0) { throw 'Build tool dependencies failed' }
            dart test | Tee-Object -FilePath (Join-Path $evidence 'build-tool-tests.txt')
            if ($LASTEXITCODE -ne 0) { throw 'Build tool regressions failed' }
          } finally { Pop-Location }
          dart tooling/apply_core_patches.dart
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Core patch application failed' }
          Push-Location core
          try {
            $env:CGO_ENABLED = '0'
            go test -count=1 -v . | Tee-Object -FilePath (Join-Path $evidence 'core-tests.txt')
            if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 Core tests failed' }
            go vet .
            if ($LASTEXITCODE -ne 0) { throw 'Core analysis failed' }
          } finally { Pop-Location }
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Helper formatting failed' }
          cargo test --manifest-path services/helper/Cargo.toml --features windows-service | Tee-Object -FilePath (Join-Path $evidence 'helper-windows-service-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows Helper tests failed' }


      - name: Prepare remote configuration build keys
        env:
          AES_KEY: ${{ secrets.REMOTE_CONFIG_AES_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.REMOTE_CONFIG_SIGNING_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AES_KEY) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PUBLIC_KEY)) { throw 'Remote build configuration keys are required' }
          [void][IO.Directory]::CreateDirectory((Join-Path $PWD 'tooling/remote_config'))
          $keys = @{ aesKey = $env:AES_KEY; signingPublicKey = $env:SIGNING_PUBLIC_KEY } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD 'tooling/remote_config/keys.json'), $keys, [Text.UTF8Encoding]::new($false))

      - name: Build the stable 1.0.9 ARM64 installer
        id: build
        run: |
          dart setup.dart windows --arch arm64 --env stable --targets exe
          if ($LASTEXITCODE -ne 0) { throw 'Stable release packaging failed' }
          $installers = @(Get-ChildItem dist -Filter '*windows*.exe' -File)
          if ($installers.Count -ne 1 -or (Get-AuthenticodeSignature -LiteralPath $installers[0].FullName).Status -cne 'NotSigned') { throw 'Exactly one stable installer awaiting signing is required' }
          Rename-Item -LiteralPath $installers[0].FullName -NewName 'fengwo-windows-1.0.9-arm64-setup-unsigned.exe'
          . ./tooling/windows/real/release_common.ps1
          $installer = Get-Item dist/fengwo-windows-1.0.9-arm64-setup-unsigned.exe
          $bundle = Join-Path $PWD 'build/windows/arm64/runner/Release'
          ./tooling/windows/verify_vc_runtime_bundle.ps1 -Architecture arm64 -BundleDirectory $bundle
          ./tooling/windows/arm64/verify_bundle.ps1 -ExpectedVersion 1.0.9 -BundleDirectory $bundle -InstallerPath $installer.FullName -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'windows-109-evidence/native-package')
          foreach ($name in @('FengWo.exe', 'FengWoCore.exe', 'FengWoHelperService.exe')) {
            if (-not (Get-FwPeIdentity (Join-Path $bundle $name)).arm64) { throw ('The test payload was not native ARM64: ' + $name) }
          }
          $app = Get-Item (Join-Path $bundle 'FengWo.exe')
          if ($app.VersionInfo.ProductVersion -cne '1.0.9' -or $app.VersionInfo.FileVersion -cne '1.0.9') { throw 'The stable application PE version differs from 1.0.9' }
          $identities = @(@('FengWo.exe', 'FengWoCore.exe', 'FengWoHelperService.exe') | ForEach-Object { Get-FwPeIdentity (Join-Path $bundle $_) })
          Save-FwArmEvidence (Join-Path $env:RUNNER_TEMP 'windows-109-evidence/payload-identities.json') ([ordered]@{ version = $app.VersionInfo.ProductVersion; file_version = $app.VersionInfo.FileVersion; payload = $identities; authenticode_status = (Get-AuthenticodeSignature -LiteralPath $installer.FullName).Status.ToString() })
          $coreHash = (Get-FileHash -LiteralPath (Join-Path $bundle 'FengWoCore.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content -LiteralPath (Join-Path $bundle 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.coreSha256 -cne $coreHash) { throw 'The packaged Core hash did not match its integrity manifest' }
          Save-FwArmEvidence (Join-Path $env:RUNNER_TEMP 'windows-109-evidence/package.json') ([ordered]@{ version = '1.0.9'; release_sequence = 2026101209; stable_build = $true; source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; architecture = 'arm64'; installer_name = $installer.Name; installer_sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); installer_bytes = $installer.Length; core_sha256 = $coreHash; unsigned_test_only = $false; digitally_signed = $false; customer_account_uploaded = $false; real_gui_chain_tested = $false })

      - name: Install and exercise the new packaged Core chain
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-109-evidence'
          $bundle = Join-Path $env:RUNNER_TEMP 'windows-109-installed'
          $process = Start-Process -FilePath (Join-Path $PWD 'dist/fengwo-windows-1.0.9-arm64-setup-unsigned.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR=' + $bundle), '/TASKS=', ('/LOG=' + (Join-Path $evidence 'installation.log'))) -PassThru
          if (-not $process.WaitForExit(120000) -or $process.ExitCode -ne 0) { throw 'The new test installer did not complete normally' }
          $package = Get-Content -LiteralPath (Join-Path $evidence 'package.json') -Raw | ConvertFrom-Json
          if ((Get-FileHash -LiteralPath (Join-Path $bundle 'FengWoCore.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $package.core_sha256) { throw 'The actual installed Core differed from the new package payload' }
          ./tooling/windows/real/test_chain_native.ps1 -Architecture arm64 -BundleDirectory $bundle -EvidenceDirectory (Join-Path $evidence 'native-chain')

      - name: Download the actual October 7 legacy Helper and Core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '37602827410'
          name: fengwo-windows-amd64
          path: ${{ runner.temp }}/legacy-helper-package

      - name: Verify real old 47906 and new 47907 Helper coexistence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tooling/windows/real/release_common.ps1
          $oldRun = Invoke-RestMethod -Uri ('https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/actions/runs/37602827410') -Headers @{ Authorization = 'Bearer ' + $env:GH_TOKEN; Accept = 'application/vnd.github+json' }
          if ($oldRun.conclusion -cne 'success' -or $oldRun.head_sha -cne '9a71d2e4bd155aa8f61af08ec081642cb71da84c') { throw 'The October 7 legacy build provenance differs' }
          $archives = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'legacy-helper-package') -Recurse -File -Filter 'fengwo-windows-amd64-release-unsigned.zip')
          $archiveSha = '75071df1a50e40fe6d4d0a82d60289036bd9ab7130bd99ee497d6f617b04aa00'
          if ($archives.Count -ne 1 -or (Get-FileHash $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $archiveSha) { throw 'The actual legacy Helper/Core release archive does not verify' }
          $legacy = Join-Path $env:RUNNER_TEMP 'legacy-helper-binaries'
          [void][IO.Directory]::CreateDirectory($legacy)
          $archive = [IO.Compression.ZipFile]::OpenRead($archives[0].FullName)
          try {
            foreach ($name in @('FlClashCore.exe', 'FlClashHelperService.exe', 'manifest.json')) {
              $entry = $archive.GetEntry($name)
              if (-not $entry) { throw ('The actual legacy component is missing: ' + $name) }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $legacy $name), $false)
            }
          } finally { $archive.Dispose() }
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-109-evidence/helper-port-coexistence'
          Save-FwArmEvidence (Join-Path $evidence 'provenance.json') ([ordered]@{ new_package_build_sha = $env:GITHUB_SHA; new_package_run_id = $env:GITHUB_RUN_ID; old_package_build_sha = $oldRun.head_sha; old_package_run_id = '37602827410'; old_archive_sha256 = $archiveSha; actual_old_release_binaries = $true; customer_account_uploaded = $false })
          ./tooling/windows/real/test_helper_port_coexistence.ps1 -Architecture arm64 -BundleDirectory (Join-Path $env:RUNNER_TEMP 'windows-109-installed') -LegacyBundleDirectory $legacy -InstallerPath (Join-Path $PWD 'dist/fengwo-windows-1.0.9-arm64-setup-unsigned.exe') -EvidenceDirectory $evidence

      - name: Verify FlClash and FengWo resource fixture coexistence
        timeout-minutes: 15
        run: |
          ./tooling/windows/arm64/test_flclash_coexistence.ps1 -InstallerPath dist/fengwo-windows-1.0.9-arm64-setup-unsigned.exe -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'windows-109-evidence/coexistence')


      - name: Verify real legacy cleanup in fresh Windows PowerShell 5.1
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          ./tooling/windows/arm64/test_legacy_install_cleanup.ps1 -BundleDirectory build/windows/arm64/runner/Release -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'windows-109-evidence/legacy-ownership')


      - name: Compile and execute the native system proxy suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-109-evidence'
          cmake -S windows -B build/windows/arm64 -G $env:FENGWO_ARM64_CMAKE_GENERATOR -A ARM64 '-DFLUTTER_TARGET_PLATFORM=windows-arm64' -Dinclude_proxy_tests=ON '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
          if ($LASTEXITCODE -ne 0) { throw 'Native proxy test configuration failed' }
          cmake --build build/windows/arm64 --config Release --target proxy_test proxy_session_windows_test proxy_winhttp_compatibility_test
          if ($LASTEXITCODE -ne 0) { throw 'Native proxy test compilation failed' }
          . ./tooling/windows/real/release_common.ps1
          foreach ($name in @('proxy_test.exe', 'proxy_session_windows_test.exe', 'proxy_winhttp_compatibility_test.exe')) {
            if (-not (Get-FwPeIdentity (Join-Path $PWD ('build/windows/arm64/plugins/proxy/Release/' + $name))).arm64) { throw ('Proxy test is not native ARM64: ' + $name) }
          }
          ctest --test-dir build/windows/arm64/plugins/proxy -C Release --output-on-failure --no-tests=error -R Proxy --output-junit (Join-Path $evidence 'proxy-ctest.xml') | Tee-Object -FilePath (Join-Path $evidence 'proxy-ctest.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Native proxy tests failed' }
          [xml]$report = Get-Content -LiteralPath (Join-Path $evidence 'proxy-ctest.xml') -Raw
          if ($report.SelectNodes('//testcase').Count -ne 51 -or $report.SelectNodes('//failure|//error|//skipped').Count -ne 0) { throw 'Expected all 51 native proxy tests without skips' }
          & ./build/windows/arm64/plugins/proxy/Release/proxy_session_windows_test.exe | Tee-Object -FilePath (Join-Path $evidence 'proxy-session-windows.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Actual WinINet session restoration failed' }
          $raw = Join-Path $evidence 'proxy-raw-bypass.txt'
          $normalized = Join-Path $evidence 'proxy-normalized-bypass.txt'
          [IO.File]::WriteAllText($raw, 'localhost;*.local;127.*;10.*;172.16.*;192.168.*;::1', [Text.UTF8Encoding]::new($false))
          & ./build/windows/arm64/plugins/proxy/Release/proxy_winhttp_compatibility_test.exe $raw $normalized | Tee-Object -FilePath (Join-Path $evidence 'proxy-winhttp.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Actual WinHTTP proxy compatibility failed' }


      - name: Verify actual native ARM64 Core listener and TUN lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./tooling/windows/arm64/test_core_runtime.ps1 -BundleDirectory build/windows/arm64/runner/Release -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'windows-109-evidence/core-runtime')

      - name: Verify installed ARM64 application and overwrite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./tooling/windows/arm64/test_installed_package.ps1 -InstallerPath dist/fengwo-windows-1.0.9-arm64-setup-unsigned.exe -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'windows-109-evidence/installation-verification')


      - name: Verify installed Helper repair and service overwrite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./tooling/windows/test_helper_service_repair.ps1 -InstallerPath dist/fengwo-windows-1.0.9-arm64-setup-unsigned.exe -OutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-109-evidence/helper-repair')


      - name: Remove only the isolated test installation and local build key files
        if: always()
        run: |
          $uninstaller = Join-Path $env:RUNNER_TEMP 'windows-109-installed/unins000.exe'
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            $process = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG=' + (Join-Path $env:RUNNER_TEMP 'windows-109-evidence/uninstallation.log'))) -PassThru
            if (-not $process.WaitForExit(120000) -or $process.ExitCode -ne 0) { throw 'The isolated new package did not uninstall normally' }
          }
          foreach ($path in @('env.json', 'tooling/remote_config/keys.json')) {
            if (Test-Path -LiteralPath $path -PathType Leaf) { Remove-Item -LiteralPath $path -Force }
          }

      - name: Preserve compiled payload if installer packaging fails
        if: ${{ !cancelled() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-windows-arm64-compiled-payload-${{ github.run_id }}
          path: |
            build/windows/arm64/runner/Release
            dist/*.iss
          if-no-files-found: warn
          retention-days: 7

      - name: Upload synthetic verification evidence and the installer awaiting signing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-windows-1.0.9-arm64-setup-unsigned-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/windows-109-evidence
            ${{ runner.temp }}/arm64-evidence
            dist/fengwo-windows-1.0.9-arm64-setup-unsigned.exe
          if-no-files-found: error
          retention-days: 7
