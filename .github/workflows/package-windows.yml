name: fengwo-windows-package

on:
  push:
    tags:
      - 'fengwo-package-windows-*'

jobs:
  package:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Prepare build keys
        shell: pwsh
        env:
          AES_KEY: ${{ secrets.REMOTE_CONFIG_AES_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.REMOTE_CONFIG_SIGNING_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AES_KEY)) { throw 'Missing AES key' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PUBLIC_KEY)) { throw 'Missing signing public key' }
          New-Item -ItemType Directory -Force tooling/remote_config | Out-Null
          $keys = @{
            aesKey = $env:AES_KEY
            signingPublicKey = $env:SIGNING_PUBLIC_KEY
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText(
            "$PWD/tooling/remote_config/keys.json",
            $keys,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Get dependencies
        run: flutter pub get

      - name: Test latency and packaging contracts
        shell: pwsh
        run: |
          flutter test test/core/controller_test.dart test/core/protocol_contract_test.dart test/views/proxies/common_test.dart test/common/task_test.dart test/models/config_test.dart test/common/windows_proxy_guard_test.dart test/common/network_diagnostic_test.dart test/pages/login_test.dart test/common/xboard_session_storage_test.dart test/common/xboard_auth_test.dart --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Flutter tests failed' }
          Push-Location core
          $env:CGO_ENABLED = '0'
          go test .
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          Pop-Location

      - name: Package stable Windows release
        run: dart setup.dart windows --env stable --targets exe,zip

      - name: Test Windows system proxy round trip
        shell: pwsh
        env:
          FENGWO_PROXY_MUTATING_TEST: '1'
        run: |
          cmake -S windows -B build/windows/x64 -Dinclude_proxy_tests=ON
          if ($LASTEXITCODE -ne 0) { throw 'Proxy test configuration failed' }
          cmake --build build/windows/x64 --config Release --target proxy_test
          if ($LASTEXITCODE -ne 0) { throw 'Proxy test compilation failed' }
          ctest --test-dir build/windows/x64/plugins/proxy -C Release --output-on-failure --no-tests=error -R Proxy
          if ($LASTEXITCODE -ne 0) { throw 'Proxy tests failed' }

      - name: Verify Windows package
        shell: pwsh
        run: |
          $names = Get-ChildItem dist -File | ForEach-Object Name
          if (($names -join "`n") -match '(?i)pre') { throw 'Package name contains pre' }
          $archive = Get-ChildItem dist -Filter '*windows*.zip' | Select-Object -First 1
          if ($null -eq $archive) { throw 'Windows archive not found' }
          Expand-Archive $archive.FullName -DestinationPath verify-windows -Force
          $app = Get-ChildItem verify-windows -Recurse -Filter FlClash.exe | Where-Object { $_.FullName -notmatch 'Core' } | Select-Object -First 1
          $core = Get-ChildItem verify-windows -Recurse -Filter FlClashCore.exe | Select-Object -First 1
          $wifiPlugin = Get-ChildItem verify-windows -Recurse -Filter wifi_ssid_plugin.dll | Select-Object -First 1
          if ($null -eq $app) { throw 'FlClash.exe not found' }
          if ($null -eq $core) { throw 'FlClashCore.exe not found' }
          if ($null -eq $wifiPlugin) { throw 'wifi_ssid_plugin.dll not found' }
          if ($app.VersionInfo.ProductName -ne '蜂窝加速器') { throw "Unexpected product name: $($app.VersionInfo.ProductName)" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vsInstall\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $dumpbin) { throw 'dumpbin.exe not found' }
          $wifiDependencies = & $dumpbin.FullName /DEPENDENTS $wifiPlugin.FullName | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect wifi_ssid_plugin.dll dependencies' }
          if ($wifiDependencies -match '(?im)^\s*wlanapi\.dll\s*$') { throw 'wifi_ssid_plugin.dll statically imports wlanapi.dll' }
          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited -and $process.ExitCode -ne 0) { throw "Application exited with $($process.ExitCode)" }
          . ./tooling/verify_windows_title.ps1
          [void](Assert-FengWoWindowTitle -ProcessId $process.Id)
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }

      - name: Verify installed shortcut can reopen hidden window
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*windows*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer not found' }
          $installDir = Join-Path $env:RUNNER_TEMP 'fengwo-shortcut-test'
          $installArguments = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/DIR=$installDir",
            '/TASKS=desktopicon'
          )
          $install = Start-Process -FilePath $installer.FullName -ArgumentList $installArguments -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $shortcutCandidates = @(
            (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) '蜂窝加速器.lnk'),
            (Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) '蜂窝加速器.lnk'),
            (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) '蜂窝加速器.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Programs')) '蜂窝加速器.lnk')
          )
          $expectedTarget = Join-Path $installDir 'FlClash.exe'
          if (-not (Test-Path -LiteralPath $expectedTarget -PathType Leaf)) {
            throw "Installed executable not found: $expectedTarget"
          }
          $shortcutPath = $shortcutCandidates |
            Select-Object -Unique |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($shortcutPath)) { throw 'Installed shortcut not found' }
          Write-Host "Testing installed shortcut: $shortcutPath"
          Start-Process -FilePath $shortcutPath
          Start-Sleep -Seconds 8
          $primary = Get-Process FlClash -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $primary) { throw 'Installed application did not start' }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class FengWoWindowTest {
            [DllImport("user32.dll")]
            public static extern bool ShowWindow(IntPtr window, int command);
            [DllImport("user32.dll")]
            public static extern bool IsWindowVisible(IntPtr window);
          }
          '@
          . ./tooling/verify_windows_title.ps1
          $window = Assert-FengWoWindowTitle -ProcessId $primary.Id
          [void][FengWoWindowTest]::ShowWindow($window, 0)
          if ([FengWoWindowTest]::IsWindowVisible($window)) { throw 'Failed to hide the primary window for the reopen test' }
          $primaryId = $primary.Id
          Start-Process -FilePath $shortcutPath
          Start-Sleep -Seconds 4
          $instances = @(Get-Process FlClash -ErrorAction SilentlyContinue)
          if ($instances.Count -ne 1) { throw "Expected one FlClash instance, found $($instances.Count)" }
          if ($instances[0].Id -ne $primaryId) { throw 'Second shortcut replaced the primary process' }
          if (-not [FengWoWindowTest]::IsWindowVisible($window)) {
            throw 'Shortcut did not restore the hidden primary window'
          }
          [void](Assert-FengWoWindowTitle -ProcessId $primaryId)
          $instances | Stop-Process -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-windows-amd64
          path: dist
          if-no-files-found: error
