name: fengwo-windows-package
run-name: Windows stable · ${{ github.sha }}

on:
  push:
    tags:
      - 'fengwo-package-windows-*'

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Test Windows installer integrity checks
        shell: powershell
        run: |
          ./tooling/windows/test_integrity_installer.ps1 -OutputDirectory "$env:RUNNER_TEMP/integrity-installer-verification"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Prepare build keys
        shell: pwsh
        env:
          AES_KEY: ${{ secrets.REMOTE_CONFIG_AES_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.REMOTE_CONFIG_SIGNING_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AES_KEY)) { throw 'Missing AES key' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PUBLIC_KEY)) { throw 'Missing signing public key' }
          New-Item -ItemType Directory -Force tooling/remote_config | Out-Null
          $keys = @{
            aesKey = $env:AES_KEY
            signingPublicKey = $env:SIGNING_PUBLIC_KEY
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText(
            "$PWD/tooling/remote_config/keys.json",
            $keys,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Download verified online v1.0.11 overwrite baseline
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'fengwo-baseline-1.0.11.exe'
          Invoke-WebRequest -Uri 'https://picture.sansen.tech/fengwo-windows-amd64-setup.exe' -OutFile $baseline
          $hash = (Get-FileHash -LiteralPath $baseline -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne '57c355f4ba2b11913659d1ac3ec73fcee27aea9fb6e73f730e8161e54a155db3') { throw 'The online v1.0.11 baseline changed; refusing an unverified overwrite test' }
          $signature = Get-AuthenticodeSignature -LiteralPath $baseline
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw 'The baseline must have a trusted timestamped OV signature' }
          $publisher = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($signature.SignerCertificate.RawData)).ToLowerInvariant()
          if ($publisher -cne '27e3e2e77a0c5f3428eeb95a35825d4cf0c8710e760e9c8cb12b447d39603252') { throw 'The baseline publisher certificate changed' }
          $directory = Join-Path $env:RUNNER_TEMP 'release-validation'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          @{ version = '1.0.11'; bytes = (Get-Item -LiteralPath $baseline).Length; sha256 = $hash; authenticode_status = [string]$signature.Status; publisher_certificate_sha256 = $publisher; timestamped = $true } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $directory 'baseline.json') -Encoding utf8NoBOM
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tooling/windows/test_installed_upgrade.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

      - name: Get dependencies and analyze the complete application
        shell: pwsh
        run: |
          flutter pub get 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/release-validation/flutter-pub-get.log"
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependency resolution failed' }
          flutter analyze --no-pub --no-fatal-infos 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/release-validation/flutter-analyze.log"
          if ($LASTEXITCODE -ne 0) { throw 'Flutter analysis failed' }

      - name: Test actual Windows process integrity levels
        shell: pwsh
        run: |
          dart compile exe tooling/windows_integrity_probe.dart -o "$env:RUNNER_TEMP/FengWoIntegrityProbe.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows integrity probe compilation failed' }
          ./tooling/windows/test_runtime_integrity.ps1 -ProbePath "$env:RUNNER_TEMP/FengWoIntegrityProbe.exe" -OutputPath "$env:RUNNER_TEMP/integrity-runtime-verification/runtime-integrity.json"

      - name: Test Windows TLS roots against live APIs
        shell: pwsh
        run: |
          flutter test test/common/windows_tls_trust_test.dart tooling/windows_tls_live_smoke_test.dart --no-pub --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Windows strict TLS regression failed' }

      - name: Test collector on Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tooling/windows/collect_tls_diagnostics.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'Collector parse failed' }
          & ./tooling/windows/collect_tls_diagnostics.ps1 -TargetsFile "$PWD/build/tls_targets.json" -OutputDirectory "$env:RUNNER_TEMP/tls-diagnostics"
          $reportFile = Get-ChildItem "$env:RUNNER_TEMP/tls-diagnostics" -Filter '*.json' | Select-Object -First 1
          $report = Get-Content $reportFile.FullName -Raw | ConvertFrom-Json
          $expectedInput = Get-Content -LiteralPath "$PWD/build/tls_targets.json" -Raw | ConvertFrom-Json
          $expectedTargets = @($expectedInput | ForEach-Object { ([Uri]$_).AbsoluteUri } | Select-Object -Unique)
          $actualTargets = @($report.endpoints | ForEach-Object { [string]$_.url })
          if ($expectedTargets.Count -lt 3 -or $expectedTargets.Count -gt 8) { throw 'Unexpected public endpoint input count' }
          if ($actualTargets.Count -ne $expectedTargets.Count -or @(Compare-Object $expectedTargets $actualTargets -CaseSensitive).Count -ne 0) { throw 'Collector did not inspect every configured public endpoint' }
          if ($report.powershell_version -notlike '5.1.*') { throw 'Wrong PowerShell runtime' }
          if ($report.elapsed_seconds -gt 120) { throw 'Collector exceeded two-minute budget' }
          if (@(Get-ChildItem "$env:RUNNER_TEMP/tls-diagnostics" -Filter '*.txt').Count -ne 1) { throw 'Missing text report' }

      - name: Test Windows runtime prerequisites
        shell: pwsh
        run: |
          ./tooling/windows/test_prepare_vc_runtime.ps1
          ./tooling/windows/test_vc_runtime_bundle.ps1
          ./tooling/windows/test_vc_runtime_installer.ps1
          flutter test test/windows_runtime_bundle_test.dart --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging tests failed' }

      - name: Test Windows auto launch uninstall callbacks
        shell: pwsh
        run: |
          ./tooling/windows/test_autostart_uninstall.ps1 -OutputDirectory "$env:RUNNER_TEMP/autostart-uninstall-verification"

      - name: Apply pinned Core patches
        shell: pwsh
        run: |
          Push-Location plugins/setup/buildkit/build_tool
          dart pub get
          if ($LASTEXITCODE -ne 0) { throw 'Build tool dependencies failed' }
          Pop-Location
          dart tooling/apply_core_patches.dart
          if ($LASTEXITCODE -ne 0) { throw 'Core patch application failed' }

      - name: Test Core patch application
        working-directory: plugins/setup/buildkit/build_tool
        shell: pwsh
        run: |
          dart pub get
          if ($LASTEXITCODE -ne 0) { throw 'Build tool dependencies failed' }
          dart test test/core_patches_test.dart
          if ($LASTEXITCODE -ne 0) { throw 'Core patch tests failed' }

      - name: Test live API fallback and encryption
        shell: pwsh
        run: |
          foreach ($case in @('redundant', 'backup', 'bundled')) {
            flutter test tooling/api_remote_config_live_smoke_test.dart --no-pub --reporter expanded --plain-name $case 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/release-validation/live-api-$case.log"
            if ($LASTEXITCODE -ne 0) { throw "Live API encryption check failed: $case" }
          }

      - name: Test the complete Flutter application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gitRoot = Split-Path -Parent (Split-Path -Parent (Get-Command git -ErrorAction Stop).Source)
          $gitBash = Join-Path $gitRoot 'bin/bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) { throw 'Git Bash is required for setup shell checks' }
          $env:FENGWO_SETUP_TEST_BASH = $gitBash
          $gitBash | Set-Content -LiteralPath "$env:RUNNER_TEMP/release-validation/setup-test-bash.txt" -Encoding utf8NoBOM
          flutter test --no-pub --reporter expanded 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/release-validation/flutter-full-root.log"
          if ($LASTEXITCODE -ne 0) { throw 'Complete Flutter application tests failed' }
          node --test tooling/tests/crisp_support_bridge_test.cjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/release-validation/crisp-bridge.log"
          if ($LASTEXITCODE -ne 0) { throw 'Crisp message bridge tests failed' }

      - name: Analyze and test bundled Flutter plugins
        shell: pwsh
        run: |
          foreach ($package in @('proxy', 'wifi_ssid', 'window_ext', 'setup')) {
            Push-Location "plugins/$package"
            try {
              flutter pub get 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/release-validation/plugin-$package-pub-get.log"
              if ($LASTEXITCODE -ne 0) { throw "Plugin dependency resolution failed: $package" }
              flutter analyze --no-pub --no-fatal-infos 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/release-validation/plugin-$package-analyze.log"
              if ($LASTEXITCODE -ne 0) { throw "Plugin analysis failed: $package" }
              if ($package -in @('proxy', 'wifi_ssid')) {
                flutter test --no-pub --reporter expanded 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/release-validation/plugin-$package-tests.log"
                if ($LASTEXITCODE -ne 0) { throw "Plugin tests failed: $package" }
              }
            } finally {
              Pop-Location
            }
          }

      - name: Test native Windows listeners
        shell: pwsh
        run: |
          Push-Location core
          $env:CGO_ENABLED = '0'
          go test -count=1 -v .
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          go vet .
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }
          Pop-Location

      - name: Test Windows helper service
        shell: pwsh
        run: |
          cargo test --manifest-path services/helper/Cargo.toml --features windows-service
          if ($LASTEXITCODE -ne 0) { throw 'Windows helper tests failed' }

      - name: Package stable Windows release
        run: dart setup.dart windows --env stable --targets exe

      - name: Test Windows system proxy round trip
        shell: pwsh
        env:
          FENGWO_PROXY_MUTATING_TEST: '1'
        run: |
          cmake -S windows -B build/windows/x64 -Dinclude_proxy_tests=ON
          if ($LASTEXITCODE -ne 0) { throw 'Proxy test configuration failed' }
          cmake --build build/windows/x64 --config Release --target proxy_test proxy_session_test proxy_session_windows_test
          if ($LASTEXITCODE -ne 0) { throw 'Proxy test compilation failed' }
          & ./build/windows/x64/plugins/proxy/Release/proxy_session_test.exe | Tee-Object -FilePath "$env:RUNNER_TEMP/proxy-session-regression.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Proxy session regression failed' }
          & ./build/windows/x64/plugins/proxy/Release/proxy_session_windows_test.exe | Tee-Object -FilePath "$env:RUNNER_TEMP/proxy-session-windows.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Native proxy session restoration failed' }
          ctest --test-dir build/windows/x64/plugins/proxy -C Release --output-on-failure --no-tests=error -R Proxy
          if ($LASTEXITCODE -ne 0) { throw 'Proxy tests failed' }
          cmake --build build/windows/x64 --config Release --target proxy_winhttp_compatibility_test
          if ($LASTEXITCODE -ne 0) { throw 'WinHTTP proxy compatibility test compilation failed' }
          $rawBypass = Join-Path $env:RUNNER_TEMP 'legacy-proxy-bypass.txt'
          $normalizedBypass = Join-Path $env:RUNNER_TEMP 'normalized-proxy-bypass.txt'
          [IO.File]::WriteAllText($rawBypass, 'localhost;*.local;127.*;10.*;172.16.*;192.168.*;::1', [Text.UTF8Encoding]::new($false))
          & ./build/windows/x64/plugins/proxy/Release/proxy_winhttp_compatibility_test.exe $rawBypass $normalizedBypass | Tee-Object -FilePath "$env:RUNNER_TEMP/proxy-winhttp-regression.txt"
          if ($LASTEXITCODE -ne 0) { throw 'WinHTTP proxy compatibility regression failed' }

      - name: Verify Windows package
        shell: pwsh
        run: |
          $names = Get-ChildItem dist -File | ForEach-Object Name
          if (($names -join "`n") -match '(?i)pre') { throw 'Package name contains pre' }
          $archives = @(Get-ChildItem dist -Filter '*.zip' -File)
          if ($archives.Count -ne 0) { throw 'ZIP product must not be generated' }
          $installers = @(Get-ChildItem dist -Filter '*windows*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $bundle = Join-Path $PWD 'build/windows/x64/runner/Release'
          $app = Get-Item (Join-Path $bundle 'FengWo.exe')
          $core = Get-Item (Join-Path $bundle 'FengWoCore.exe')
          $helper = Get-Item (Join-Path $bundle 'FengWoHelperService.exe')
          $wifiPlugin = Get-Item (Join-Path $bundle 'wifi_ssid_plugin.dll')
          if ($null -eq $app) { throw 'FengWo.exe not found' }
          ./tooling/windows/verify_vc_runtime_bundle.ps1 -Architecture x64 -BundleDirectory $app.DirectoryName
          if ($null -eq $core) { throw 'FengWoCore.exe not found' }
          if ($null -eq $wifiPlugin) { throw 'wifi_ssid_plugin.dll not found' }
          if ($null -eq $helper) { throw 'FengWoHelperService.exe not found' }
          $manifest = Get-Content -LiteralPath (Join-Path $bundle 'manifest.json') -Raw | ConvertFrom-Json
          $coreHash = (Get-FileHash -LiteralPath $core.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.coreSha256 -cne $coreHash) { throw 'Packaged Core hash differs from manifest' }
          foreach ($binary in @($app, $core, $helper, $wifiPlugin)) {
            $bytes = [System.IO.File]::ReadAllBytes($binary.FullName)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) { throw "Invalid PE signature: $($binary.Name)" }
            if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw "Expected x64 binary: $($binary.Name)" }
          }
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\s*$'
          if ($null -eq $versionLine) { throw 'A stable version without build metadata is required' }
          $expectedVersion = $versionLine.Matches[0].Groups[1].Value
          if ($app.VersionInfo.ProductVersion -ne $expectedVersion) { throw "Unexpected product version: $($app.VersionInfo.ProductVersion)" }
          if ($app.VersionInfo.FileVersion -ne $expectedVersion) { throw "Unexpected file version: $($app.VersionInfo.FileVersion)" }
          if ($app.VersionInfo.ProductName -ne '蜂窝加速器') { throw "Unexpected product name: $($app.VersionInfo.ProductName)" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vsInstall\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $dumpbin) { throw 'dumpbin.exe not found' }
          $wifiDependencies = & $dumpbin.FullName /DEPENDENTS $wifiPlugin.FullName | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect wifi_ssid_plugin.dll dependencies' }
          if ($wifiDependencies -match '(?im)^\s*wlanapi\.dll\s*$') { throw 'wifi_ssid_plugin.dll statically imports wlanapi.dll' }
          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited -and $process.ExitCode -ne 0) { throw "Application exited with $($process.ExitCode)" }
          . ./tooling/verify_windows_title.ps1
          [void](Assert-FengWoWindowTitle -ProcessId $process.Id)
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }

      - name: Verify installed shortcut can reopen hidden window
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*windows*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer not found' }
          $installDir = Join-Path $env:RUNNER_TEMP 'fengwo-shortcut-test'
          $installArguments = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/DIR=$installDir",
            '/TASKS=desktopicon'
          )
          $install = Start-Process -FilePath $installer.FullName -ArgumentList $installArguments -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $shortcutCandidates = @(
            (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) '蜂窝加速器.lnk'),
            (Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) '蜂窝加速器.lnk'),
            (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) '蜂窝加速器.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Programs')) '蜂窝加速器.lnk')
          )
          $expectedTarget = Join-Path $installDir 'FengWo.exe'
          if (-not (Test-Path -LiteralPath $expectedTarget -PathType Leaf)) {
            throw "Installed executable not found: $expectedTarget"
          }
          $shortcutPath = $shortcutCandidates |
            Select-Object -Unique |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($shortcutPath)) { throw 'Installed shortcut not found' }
          Write-Host "Testing installed shortcut: $shortcutPath"
          Start-Process -FilePath $shortcutPath
          Start-Sleep -Seconds 8
          $primary = Get-Process FengWo -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $primary) { throw 'Installed application did not start' }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class FengWoWindowTest {
            [DllImport("user32.dll")]
            public static extern bool ShowWindow(IntPtr window, int command);
            [DllImport("user32.dll")]
            public static extern bool IsWindowVisible(IntPtr window);
          }
          '@
          . ./tooling/verify_windows_title.ps1
          $window = Assert-FengWoWindowTitle -ProcessId $primary.Id
          [void][FengWoWindowTest]::ShowWindow($window, 0)
          if ([FengWoWindowTest]::IsWindowVisible($window)) { throw 'Failed to hide the primary window for the reopen test' }
          $primaryId = $primary.Id
          Start-Process -FilePath $shortcutPath
          Start-Sleep -Seconds 4
          $instances = @(Get-Process FengWo -ErrorAction SilentlyContinue)
          if ($instances.Count -ne 1) { throw "Expected one FengWo instance, found $($instances.Count)" }
          if ($instances[0].Id -ne $primaryId) { throw 'Second shortcut replaced the primary process' }
          if (-not [FengWoWindowTest]::IsWindowVisible($window)) {
            throw 'Shortcut did not restore the hidden primary window'
          }
          [void](Assert-FengWoWindowTitle -ProcessId $primaryId)
          $events = @(Get-ChildItem $env:APPDATA -Filter 'events.jsonl' -File -Recurse -ErrorAction SilentlyContinue)
          $tlsInitialized = $false
          foreach ($eventFile in $events) {
            foreach ($line in (Get-Content $eventFile.FullName)) {
              try {
                $entry = $line | ConvertFrom-Json
                if ($entry.event -eq 'tls.trust.initialized' -and $entry.fields.supplemental_roots -eq 2) { $tlsInitialized = $true }
              } catch {}
            }
          }
          if (-not $tlsInitialized) { throw 'Installed app did not initialize its bundled TLS roots' }
          $instances | Stop-Process -Force

      - name: Verify installed overwrite upgrade and preferences recovery
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*windows*.exe' -File | Select-Object -First 1
          ./tooling/windows/test_installed_upgrade.ps1 -InstallerPath $installer.FullName -OutputDirectory "$env:RUNNER_TEMP/upgrade-verification" -PreviousInstallerPath "$env:RUNNER_TEMP/fengwo-baseline-1.0.11.exe" -ExpectedPreviousVersion '1.0.11'

      - name: Verify installed helper service repair and overwrite
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*windows*.exe' -File | Select-Object -First 1
          ./tooling/windows/test_helper_service_repair.ps1 -InstallerPath $installer.FullName -OutputDirectory "$env:RUNNER_TEMP/helper-repair-verification"

      - name: Verify installed Windows auto launch
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*windows*.exe' -File | Select-Object -First 1
          ./tooling/windows/test_autostart.ps1 -InstallerPath $installer.FullName -OutputDirectory "$env:RUNNER_TEMP/autostart-verification"

      - name: Record package provenance and signature status
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*windows*.exe' -File | Select-Object -First 1
          $releaseName = 'fengwo-windows-amd64-setup.exe'
          if ($installer.Name -cne $releaseName) {
            Rename-Item -LiteralPath $installer.FullName -NewName $releaseName
          }
          $installer = Get-Item (Join-Path dist $releaseName)
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata = [ordered]@{
            version = (Get-Item build/windows/x64/runner/Release/FengWo.exe).VersionInfo.ProductVersion
            release_channel = 'stable'
            release_notes = '优化加速算法'
            base_source_sha = 'c788d1699f6665681c459473a3919cfe6ff4df17'
            requires_ov_signing = $true
            publication_allowed = $false
            source_branch = 'codex/desktop-release-1.1.0-20261028'
            source_sha = $env:GITHUB_SHA
            source_ref = $env:GITHUB_REF
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            architecture = 'x64'
            app_environment = 'stable'
            installer_name = $installer.Name
            installer_bytes = $installer.Length
            installer_sha256 = $hash
            authenticode_status = $signature.Status.ToString()
            signer_subject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
            signer_thumbprint = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { $null }
            created_at_utc = [DateTime]::UtcNow.ToString('o')
          }
          $metadata | ConvertTo-Json | Set-Content -LiteralPath dist/windows-build.json -Encoding utf8NoBOM
          "$hash  $($installer.Name)" | Set-Content -LiteralPath dist/SHA256SUMS -Encoding utf8NoBOM

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-windows-amd64
          path: |
            dist/*windows*.exe
            dist/windows-build.json
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Upload Windows verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-windows-verification
          path: |
            ${{ runner.temp }}/release-validation/*
            ${{ runner.temp }}/tls-diagnostics/*
            ${{ runner.temp }}/integrity-runtime-verification/*.json
            ${{ runner.temp }}/integrity-installer-verification/*.json
            ${{ runner.temp }}/integrity-installer-verification/*.log
            ${{ runner.temp }}/upgrade-verification/*
            ${{ runner.temp }}/helper-repair-verification/*
            ${{ runner.temp }}/autostart-verification/*
            ${{ runner.temp }}/autostart-uninstall-verification/*.json
            ${{ runner.temp }}/autostart-uninstall-verification/*.log
            ${{ runner.temp }}/proxy-winhttp-regression.txt
            ${{ runner.temp }}/proxy-session-regression.txt
            ${{ runner.temp }}/proxy-session-windows.txt
          if-no-files-found: warn

      - name: Retain installer for failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-windows-failed-verification
          path: dist/*windows*.exe
          if-no-files-found: ignore
