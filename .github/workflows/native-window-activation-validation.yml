name: fengwo-native-window-activation-validation

on:
  push:
    tags:
      - 'fengwo-ci-native-window-activation-*'

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout isolated native validation
        uses: actions/checkout@v4
      - name: Compile and test production window visibility module
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          & ./.ci/native-window-activation/test_native.ps1 -TestCase 'registered-message-rejects-payload-and-medium-activates-high' -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'native-window-evidence')
      - name: Upload synthetic native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-window-activation
          path: ${{ runner.temp }}/native-window-evidence
          if-no-files-found: error
          retention-days: 14
