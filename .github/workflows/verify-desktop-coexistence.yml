name: fengwo-desktop-coexistence
run-name: Unsigned Windows x64 coexistence · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/desktop-coexistence-check-*'

permissions:
  contents: read

concurrency:
  group: desktop-coexistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      FENGWO_PROXY_MUTATING_TEST: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout isolated test source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Verify native x64 toolchain and record source provenance
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tooling/windows/arm64/common.ps1
          $environment = Assert-FwNativeRunner -Architecture x64
          $evidence = Join-Path $env:RUNNER_TEMP 'desktop-coexistence-evidence'
          [void][IO.Directory]::CreateDirectory($evidence)
          $rust = (& rustc -vV | Out-String)
          if ($LASTEXITCODE -ne 0 -or $rust -notmatch '(?m)^host: x86_64-pc-windows-msvc\s*$') { throw 'A native x64 MSVC Rust toolchain is required' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installations = @(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $installations.Count -ne 1) { throw 'The native Visual Studio installation was not found' }
          $installation = $installations[0]
          $major = ([version]$installation.installationVersion).Major
          $generator = switch ($major) { 17 { 'Visual Studio 17 2022' }; 18 { 'Visual Studio 18 2026' }; default { throw 'Unsupported Visual Studio generator' } }
          ('FENGWO_NATIVE_CMAKE_GENERATOR=' + $generator) | Add-Content -LiteralPath $env:GITHUB_ENV
          $gitBash = Join-Path $env:ProgramFiles 'Git/bin/bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) { throw 'Git Bash is required for the pinned Core build harness' }
          (Split-Path -Parent $gitBash) | Add-Content -LiteralPath $env:GITHUB_PATH
          ('FENGWO_SETUP_TEST_BASH=' + $gitBash) | Add-Content -LiteralPath $env:GITHUB_ENV
          $sourceFiles = @(git ls-files -- .github/workflows/verify-desktop-coexistence.yml setup.dart test/setup_test.dart test/windows_runtime_bundle_test.dart tooling/windows plugins/setup/buildkit plugins/setup/windows plugins/proxy windows/packaging windows/runner services/helper lib/common lib/core lib/main.dart lib/manager test/common test/core test/manager test/providers/system_action_test.dart)
          if ($LASTEXITCODE -ne 0) { throw 'Source manifest enumeration failed' }
          $sourceManifest = @($sourceFiles | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() } })
          $coreCommit = (& git -C core/Clash.Meta rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Core identity could not be read' }
          Save-FwArmEvidence (Join-Path $evidence 'source-manifest.json') ([ordered]@{ source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; core_commit = $coreCommit; unsigned_test_only = $true; files = $sourceManifest })
          Save-FwArmEvidence (Join-Path $evidence 'toolchain.json') ([ordered]@{ environment = $environment; generator = $generator; installation_version = $installation.installationVersion; rust = $rust.Trim(); go = (& go version | Out-String).Trim(); cmake = (& cmake --version | Out-String).Trim() })

      - name: Restore dependencies and pinned packaging tool
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependencies failed' }
          dart pub global activate -s git https://github.com/chen08209/flutter_distributor.git --git-ref c30ce409bef798c4f5fcedc45293eb4bc33da597 --git-path packages/flutter_distributor
          if ($LASTEXITCODE -ne 0) { throw 'Pinned packaging tool installation failed' }
          $packageCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Pub/Cache' }
          $packageBin = Join-Path $packageCache 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $packageBin 'flutter_distributor.bat') -PathType Leaf)) { throw 'The pinned packaging launcher is missing' }
          $packageBin | Add-Content -LiteralPath $env:GITHUB_PATH

      - name: Verify identity proxy and shutdown regressions
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'desktop-coexistence-evidence'
          flutter test --no-pub --reporter expanded test/common/tray_test.dart | Tee-Object -FilePath (Join-Path $evidence 'tray-copy-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Tray shell-copy tests failed' }
          flutter test --no-pub --reporter expanded test/common/app_update_test.dart test/common/app_update_transport_test.dart test/common/app_update_download_test.dart test/providers/app_update_test.dart test/providers/app_update_action_test.dart test/widgets/app_update_controls_test.dart test/common/remote_config_cipher_test.dart | Tee-Object -FilePath (Join-Path $evidence 'update-check-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Direct update check and failover tests failed' }
          flutter analyze --no-pub --no-fatal-infos | Tee-Object -FilePath (Join-Path $evidence 'flutter-analyze.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Desktop analysis failed' }
          flutter test --no-pub --reporter expanded test/setup_test.dart test/windows_runtime_bundle_test.dart test/common/windows_identity_test.dart test/common/windows_integrity_test.dart test/common/protocol_test.dart test/common/windows_proxy_guard_test.dart test/common/window_recovery_test.dart test/core/transport_test.dart test/core/desktop test/core/service_test.dart test/core/protocol_contract_test.dart test/manager/core_manager_test.dart test/manager/proxy_manager_test.dart test/manager/window_manager_test.dart test/providers/system_action_test.dart plugins/proxy/test/proxy_test.dart plugins/proxy/test/proxy_result_test.dart plugins/proxy/test/macos_service_proxy_test.dart plugins/proxy/test/windows_proxy_repair_test.dart | Tee-Object -FilePath (Join-Path $evidence 'flutter-focused-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Identity proxy and shutdown tests failed' }
          ./tooling/windows/test_prepare_vc_runtime.ps1 | Tee-Object -FilePath (Join-Path $evidence 'runtime-preparation-tests.txt')
          ./tooling/windows/test_vc_runtime_bundle.ps1 | Tee-Object -FilePath (Join-Path $evidence 'runtime-bundle-tests.txt')

      - name: Verify native installer prerequisite and integrity policies
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'desktop-coexistence-evidence'
          ./tooling/windows/test_vc_runtime_installer.ps1 6>&1 | Tee-Object -FilePath (Join-Path $evidence 'installer-prerequisite-tests.txt')
          ./tooling/windows/test_integrity_installer.ps1 -OutputDirectory (Join-Path $evidence 'installer-integrity')
          ./tooling/windows/test_autostart_uninstall.ps1 -OutputDirectory (Join-Path $evidence 'autostart-uninstall')

      - name: Apply pinned Core patches and verify Windows Helper
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'desktop-coexistence-evidence'
          Push-Location plugins/setup/buildkit/build_tool
          try {
            dart pub get
            if ($LASTEXITCODE -ne 0) { throw 'Build tool dependencies failed' }
            dart test | Tee-Object -FilePath (Join-Path $evidence 'build-tool-tests.txt')
            if ($LASTEXITCODE -ne 0) { throw 'Build tool regressions failed' }
          } finally { Pop-Location }
          dart tooling/apply_core_patches.dart
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Core patch application failed' }
          Push-Location core
          try {
            $env:CGO_ENABLED = '0'
            go test -count=1 -v . | Tee-Object -FilePath (Join-Path $evidence 'core-tests.txt')
            if ($LASTEXITCODE -ne 0) { throw 'Native x64 Core tests failed' }
            go vet .
            if ($LASTEXITCODE -ne 0) { throw 'Core analysis failed' }
          } finally { Pop-Location }
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Helper formatting failed' }
          cargo test --manifest-path services/helper/Cargo.toml --features windows-service | Tee-Object -FilePath (Join-Path $evidence 'helper-windows-service-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows Helper tests failed' }

      - name: Prepare remote configuration build keys
        env:
          AES_KEY: ${{ secrets.REMOTE_CONFIG_AES_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.REMOTE_CONFIG_SIGNING_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:AES_KEY) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PUBLIC_KEY)) { throw 'Remote configuration build keys are required' }
          [void][IO.Directory]::CreateDirectory((Join-Path $PWD 'tooling/remote_config'))
          $keys = @{ aesKey = $env:AES_KEY; signingPublicKey = $env:SIGNING_PUBLIC_KEY } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD 'tooling/remote_config/keys.json'), $keys, [Text.UTF8Encoding]::new($false))

      - name: Build an unsigned x64 coexistence installer
        id: build_installer
        run: |
          $ErrorActionPreference = 'Stop'
          dart setup.dart windows --env stable --targets exe
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned x64 test packaging failed' }
          $installers = @(Get-ChildItem dist -Filter '*windows*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Exactly one Windows x64 installer is required' }
          if ((Get-AuthenticodeSignature -LiteralPath $installers[0].FullName).Status -ne 'NotSigned') { throw 'This verification workflow accepts unsigned test installers only' }
          Rename-Item -LiteralPath $installers[0].FullName -NewName 'fengwo-windows-x64-coexistence-unsigned.exe'
          . ./tooling/windows/arm64/common.ps1
          $installer = Get-Item dist/fengwo-windows-x64-coexistence-unsigned.exe
          $bundle = Join-Path $PWD 'build/windows/x64/runner/Release'
          ./tooling/windows/verify_vc_runtime_bundle.ps1 -Architecture x64 -BundleDirectory $bundle
          foreach ($name in @('FengWo.exe', 'FengWoCore.exe', 'FengWoHelperService.exe')) {
            if (-not (Get-FwPeIdentity (Join-Path $bundle $name)).x64) { throw ('Non-native x64 product binary: ' + $name) }
          }
          $cleanup = Join-Path $bundle 'prerequisites/fengwo_install_cleanup.ps1'
          $sourceCleanup = Join-Path $PWD 'windows/packaging/exe/fengwo_install_cleanup.ps1'
          if ((Get-FileHash -LiteralPath $cleanup -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $sourceCleanup -Algorithm SHA256).Hash) { throw 'The packaged cleanup script differs from the current product source' }
          $coreHash = (Get-FileHash -LiteralPath (Join-Path $bundle 'FengWoCore.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content -LiteralPath (Join-Path $bundle 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.coreSha256 -cne $coreHash) { throw 'Packaged Core hash differs from the manifest' }
          Save-FwArmEvidence (Join-Path $env:RUNNER_TEMP 'desktop-coexistence-evidence/package.json') ([ordered]@{ architecture = 'x64'; source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; unsigned_test_only = $true; digitally_signed = $false; installer = $installer.Name; installer_bytes = $installer.Length; installer_sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); core_sha256 = $coreHash; real_customer_account_tested = $false })

      - name: Verify FlClash and FengWo resource fixture coexistence
        timeout-minutes: 15
        run: |
          ./tooling/windows/arm64/test_flclash_coexistence.ps1 -Architecture x64 -Generator $env:FENGWO_NATIVE_CMAKE_GENERATOR -InstallerPath dist/fengwo-windows-x64-coexistence-unsigned.exe -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'desktop-coexistence-evidence/coexistence')

      - name: Verify real legacy cleanup in fresh Windows PowerShell 5.1
        if: ${{ !cancelled() && steps.build_installer.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          ./tooling/windows/arm64/test_legacy_install_cleanup.ps1 -Architecture x64 -Generator $env:FENGWO_NATIVE_CMAKE_GENERATOR -BundleDirectory build/windows/x64/runner/Release -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'desktop-coexistence-evidence/legacy-ownership')

      - name: Compile and execute the native system proxy suites
        if: ${{ !cancelled() && steps.build_installer.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'desktop-coexistence-evidence'
          cmake -S windows -B build/windows/x64 -G $env:FENGWO_NATIVE_CMAKE_GENERATOR -A x64 -Dinclude_proxy_tests=ON '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
          if ($LASTEXITCODE -ne 0) { throw 'Native proxy test configuration failed' }
          cmake --build build/windows/x64 --config Release --target proxy_test proxy_session_test proxy_session_windows_test proxy_winhttp_compatibility_test
          if ($LASTEXITCODE -ne 0) { throw 'Native proxy test compilation failed' }
          . ./tooling/windows/arm64/common.ps1
          foreach ($name in @('proxy_test.exe', 'proxy_session_test.exe', 'proxy_session_windows_test.exe', 'proxy_winhttp_compatibility_test.exe')) {
            if (-not (Get-FwPeIdentity (Join-Path $PWD ('build/windows/x64/plugins/proxy/Release/' + $name))).x64) { throw ('Proxy test is not native x64: ' + $name) }
          }
          ctest --test-dir build/windows/x64/plugins/proxy -C Release --output-on-failure --no-tests=error -R '^Proxy|^proxy_session_test$' --output-junit (Join-Path $evidence 'proxy-ctest.xml') | Tee-Object -FilePath (Join-Path $evidence 'proxy-ctest.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Native proxy tests failed' }
          [xml]$report = Get-Content -LiteralPath (Join-Path $evidence 'proxy-ctest.xml') -Raw
          if ($report.SelectNodes('//testcase').Count -ne 69 -or $report.SelectNodes('//failure|//error|//skipped').Count -ne 0) { throw 'Expected all 68 native proxy tests and the standalone session test without skips' }
          & ./build/windows/x64/plugins/proxy/Release/proxy_session_windows_test.exe | Tee-Object -FilePath (Join-Path $evidence 'proxy-session-windows.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Actual WinINet session restoration failed' }
          $raw = Join-Path $evidence 'proxy-raw-bypass.txt'
          $normalized = Join-Path $evidence 'proxy-normalized-bypass.txt'
          [IO.File]::WriteAllText($raw, 'localhost;*.local;127.*;10.*;172.16.*;192.168.*;::1', [Text.UTF8Encoding]::new($false))
          & ./build/windows/x64/plugins/proxy/Release/proxy_winhttp_compatibility_test.exe $raw $normalized | Tee-Object -FilePath (Join-Path $evidence 'proxy-winhttp.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Actual WinHTTP proxy compatibility failed' }

      - name: Remove local build key files
        if: always()
        run: |
          foreach ($path in @('env.json', 'tooling/remote_config/keys.json')) {
            if (Test-Path -LiteralPath $path -PathType Leaf) { Remove-Item -LiteralPath $path -Force }
          }

      - name: Upload only verification evidence and the unsigned test installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-desktop-x64-coexistence-unsigned-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/desktop-coexistence-evidence
            dist/fengwo-windows-x64-coexistence-unsigned.exe
            build/windows/x64/plugins/proxy/Release/proxy_session_windows_test.exe
          if-no-files-found: error
          retention-days: 7
