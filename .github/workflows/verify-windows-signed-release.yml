name: fengwo-windows-signed-upgrade
on:
  push:
    branches: [codex/desktop-upstream-0897-port]
    paths: [.github/workflows/verify-windows-signed-release.yml]
  workflow_dispatch:
    inputs:
      download_base:
        required: true
        type: string
      x64_sha256:
        required: true
        type: string
      arm64_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            filename: fengwo-windows-amd64-setup.exe
            runner: windows-2022
            source: 93667849d93d8e4ea812176549eff98baf657d19
            baseline_sha256: 68be159a5f3cbd27ba0725714a209df5d9a0faa7e4e3f44bb7325c6a5abd7a72
            artifact_id: 11787283466
            unsigned_sha256: 762cd96ebe3bd909b4f9db72dedff064261ce1c4bbbd9f394701ab03d9f06584
          - architecture: arm64
            filename: fengwo-windows-arm64-setup.exe
            runner: windows-11-arm
            source: 40a1299b2a39df1c3b4fa5e79262acaf323d2c29
            baseline_sha256: a17759983113e81f52440da0d89dccada003f8b78bd589129aab35aa553e0638
            artifact_id: 11790031459
            unsigned_sha256: b2f4e472599746b7ab002b88d519b85bd729e7537c0ed9122ab8010d64e51024
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      DOWNLOAD_BASE: ${{ inputs.download_base }}
      EXPECTED_HASH: ${{ matrix.architecture == 'x64' && inputs.x64_sha256 || inputs.arm64_sha256 }}
      ARCHITECTURE: ${{ matrix.architecture }}
      INSTALLER_FILENAME: ${{ matrix.filename }}
      BASELINE_HASH: ${{ matrix.baseline_sha256 }}
      UNSIGNED_HASH: ${{ matrix.unsigned_sha256 }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Download and verify trusted signed installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = [uri]$env:DOWNLOAD_BASE
          if ($base.Scheme -cne 'https' -or $base.Host -cne 'zryc.oss-cn-beijing.aliyuncs.com' -or $base.AbsolutePath -cne '/release-tests/fengwo-windows-1.0.10-20261013/' -or $base.Query -or $base.Fragment -or $base.UserInfo -or $base.Port -ne 443) { throw 'Unexpected installer staging location' }
          if ($env:EXPECTED_HASH -cnotmatch '\A[a-f0-9]{64}\z') { throw 'Expected SHA256 is invalid' }
          $headers = @{ Authorization = 'Bearer ' + $env:GH_TOKEN; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $archive = Join-Path $env:RUNNER_TEMP 'unsigned-build.zip'
          Invoke-WebRequest -Uri ('https://api.github.com/repos/yunfangame/app/actions/artifacts/' + $env:ARTIFACT_ID + '/zip') -Headers $headers -OutFile $archive
          $unpacked = Join-Path $env:RUNNER_TEMP 'unsigned-build'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $unsigned = @(Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter $env:INSTALLER_FILENAME)
          if ($unsigned.Count -ne 1 -or (Get-FileHash -LiteralPath $unsigned[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:UNSIGNED_HASH) { throw 'Original tested build artifact mismatch' }
          $patchUrl = $env:DOWNLOAD_BASE.TrimEnd('/') + '/windows-' + $env:ARCHITECTURE + '-signature.json'
          $patch = Invoke-RestMethod -Uri $patchUrl
          if ($patch.passed -ne $true -or $patch.unsigned_sha256 -cne $env:UNSIGNED_HASH -or $patch.signed_sha256 -cne $env:EXPECTED_HASH) { throw 'Signature patch does not match pinned artifacts' }
          $original = [IO.File]::ReadAllBytes($unsigned[0].FullName)
          if ($original.Length -ne $patch.unsigned_bytes) { throw 'Unsigned artifact size mismatch' }
          $optional = [BitConverter]::ToInt32($original, 0x3c) + 24
          $magic = [BitConverter]::ToUInt16($original, $optional)
          if ($magic -notin @(0x10b, 0x20b)) { throw 'Invalid PE optional header' }
          $security = $optional + $(if ($magic -eq 0x10b) { 96 } else { 112 }) + 32
          if ($patch.segments.Count -ne 2 -or $patch.segments[0].offset -ne ($optional + 64) -or $patch.segments[1].offset -ne $security) { throw 'Unexpected signature patch ranges' }
          $trailer = [Convert]::FromBase64String($patch.trailer_base64)
          $reconstructed = [byte[]]::new($original.Length + $trailer.Length)
          [Array]::Copy($original, $reconstructed, $original.Length)
          for ($index = 0; $index -lt 2; $index++) {
            $segment = $patch.segments[$index]
            $value = [Convert]::FromBase64String($segment.base64)
            $length = if ($index -eq 0) { 4 } else { 8 }
            if ($value.Length -ne $length) { throw 'Unexpected signature patch length' }
            [Array]::Copy($value, 0, $reconstructed, [int]$segment.offset, $length)
          }
          [Array]::Copy($trailer, 0, $reconstructed, $original.Length, $trailer.Length)
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'fengwo-1.0.10.exe'), $reconstructed)
          $signatureEvidence = @()
          foreach ($version in @('1.0.9', '1.0.10')) {
            $path = Join-Path $env:RUNNER_TEMP ('fengwo-' + $version + '.exe')
            if ($version -eq '1.0.9') {
              Invoke-WebRequest -Uri ('https://picture.sansen.tech/' + $env:INSTALLER_FILENAME) -OutFile $path
            }
            $expected = if ($version -eq '1.0.9') { $env:BASELINE_HASH } else { $env:EXPECTED_HASH }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Installer hash mismatch' }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw 'Trusted timestamped Authenticode signature is required' }
            $certificateHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($signature.SignerCertificate.RawData)).ToLowerInvariant()
            if ($certificateHash -cne '27e3e2e77a0c5f3428eeb95a35825d4cf0c8710e760e9c8cb12b447d39603252') { throw 'Installer publisher certificate differs from 1.0.9' }
            $signatureEvidence += @{ version = $version; sha256 = $expected; status = [string]$signature.Status; signer_sha256 = $certificateHash; timestamp_subject = $signature.TimeStamperCertificate.Subject }
          }
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP 'signed-upgrade-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          $signatureEvidence | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidenceDirectory 'signature-evidence.json') -Encoding utf8NoBOM
      - name: Verify signed 1.0.9 to 1.0.10 overwrite upgrade
        run: |
          ./tooling/windows/test_installed_upgrade.ps1 -InstallerPath (Join-Path $env:RUNNER_TEMP 'fengwo-1.0.10.exe') -PreviousInstallerPath (Join-Path $env:RUNNER_TEMP 'fengwo-1.0.9.exe') -ExpectedPreviousVersion '1.0.9' -OutputDirectory (Join-Path $env:RUNNER_TEMP 'signed-upgrade-evidence')
      - name: Upload tested identical signed package to isolated staging
        env:
          STAGE_PUT_URL: ${{ matrix.architecture == 'x64' && secrets.FENGWO_WINDOWS_X64_STAGE_PUT_URL || secrets.FENGWO_WINDOWS_ARM64_STAGE_PUT_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = [uri]$env:STAGE_PUT_URL
          if ($url.Scheme -cne 'https' -or $url.Host -cne 'zryc.oss-cn-beijing.aliyuncs.com' -or [uri]::UnescapeDataString($url.AbsolutePath) -cne ('/release-tests/fengwo-windows-1.0.10-20261013/' + $env:INSTALLER_FILENAME) -or -not $url.Query -or $url.Fragment -or $url.UserInfo -or $url.Port -ne 443) { throw 'Unexpected isolated upload capability' }
          $path = Join-Path $env:RUNNER_TEMP 'fengwo-1.0.10.exe'
          if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_HASH) { throw 'Tested signed package changed before staging upload' }
          $config = @(
            'url = "' + $env:STAGE_PUT_URL + '"'
            'upload-file = "' + $path.Replace('\', '\\') + '"'
            'header = "Content-Type: application/octet-stream"'
            'header = "Cache-Control: no-cache"'
            'connect-timeout = 20'
            'max-time = 600'
            'silent'
            'fail'
            'output = "NUL"'
            'write-out = "%{http_code}"'
          ) -join "`n"
          $status = $config | & curl.exe --config -
          if ($LASTEXITCODE -ne 0 -or $status -cne '200') { throw ('Isolated staging upload failed; curl exit=' + $LASTEXITCODE + '; HTTP=' + $status) }
          $readback = Join-Path $env:RUNNER_TEMP 'staging-readback.exe'
          Invoke-WebRequest -Uri ($env:DOWNLOAD_BASE.TrimEnd('/') + '/' + $env:INSTALLER_FILENAME) -OutFile $readback
          if ((Get-FileHash -LiteralPath $readback -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_HASH) { throw 'Isolated staging public readback mismatch' }
          @{ passed = $true; sha256 = $env:EXPECTED_HASH; sizeBytes = (Get-Item -LiteralPath $path).Length; architecture = $env:ARCHITECTURE } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'signed-upgrade-evidence/staging-upload.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fengwo-signed-upgrade-${{ matrix.architecture }}
          path: ${{ runner.temp }}/signed-upgrade-evidence
          if-no-files-found: warn
