name: fengwo-windows-signed-upgrade
on:
  push:
    branches: [codex/desktop-upstream-0897-port]
    paths: [.github/workflows/verify-windows-signed-release.yml]
  workflow_dispatch:
    inputs:
      x64_signature_patch:
        required: true
        type: string
      arm64_signature_patch:
        required: true
        type: string
      x64_sha256:
        required: true
        type: string
      arm64_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            filename: fengwo-windows-amd64-setup.exe
            runner: windows-2022
            source: 4f5c1f50b8e3fd25376fee8aa8b8a8715786fcb0
            baseline_sha256: 157b8ebf8c4cb8289c58afedecd56fcc65a35c900e6813e7f71fbf255e7ceb85
            artifact_id: 11917999107
            unsigned_filename: fengwo-windows-x64-coexistence-unsigned.exe
            unsigned_sha256: 6260a0c796ebdd8cbf26713b868ca9e1106fdbea173b52b89b47547b62785fb0
          - architecture: arm64
            filename: fengwo-windows-arm64-setup.exe
            runner: windows-11-arm
            source: c45a45d1acfaf1c29ddb961b121f220efeecef56
            baseline_sha256: d9b682f45386adc6f026c64f0496ed8fbd0e86aca1360d0314c76d4283f144fb
            artifact_id: 11920212816
            unsigned_filename: fengwo-windows-arm64-setup.exe
            unsigned_sha256: 3fc2dca98f79c9c16242b9bc6945d75041e2a95e906edd6aa3253f5615680e4b
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      SIGNATURE_PATCH: ${{ matrix.architecture == 'x64' && inputs.x64_signature_patch || inputs.arm64_signature_patch }}
      EXPECTED_HASH: ${{ matrix.architecture == 'x64' && inputs.x64_sha256 || inputs.arm64_sha256 }}
      ARCHITECTURE: ${{ matrix.architecture }}
      INSTALLER_FILENAME: ${{ matrix.filename }}
      BASELINE_HASH: ${{ matrix.baseline_sha256 }}
      UNSIGNED_HASH: ${{ matrix.unsigned_sha256 }}
      UNSIGNED_FILENAME: ${{ matrix.unsigned_filename }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Download and verify trusted signed installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_HASH -cnotmatch '\A[a-f0-9]{64}\z') { throw 'Expected SHA256 is invalid' }
          $headers = @{ Authorization = 'Bearer ' + $env:GH_TOKEN; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $archive = Join-Path $env:RUNNER_TEMP 'unsigned-build.zip'
          Invoke-WebRequest -Uri ('https://api.github.com/repos/yunfangame/app/actions/artifacts/' + $env:ARTIFACT_ID + '/zip') -Headers $headers -OutFile $archive
          $unpacked = Join-Path $env:RUNNER_TEMP 'unsigned-build'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $unsigned = @(Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter $env:UNSIGNED_FILENAME)
          if ($unsigned.Count -ne 1 -or (Get-FileHash -LiteralPath $unsigned[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:UNSIGNED_HASH) { throw 'Original tested build artifact mismatch' }
          $patch = $env:SIGNATURE_PATCH | ConvertFrom-Json
          if ($patch.passed -ne $true -or $patch.unsigned_sha256 -cne $env:UNSIGNED_HASH -or $patch.signed_sha256 -cne $env:EXPECTED_HASH) { throw 'Signature patch does not match pinned artifacts' }
          $original = [IO.File]::ReadAllBytes($unsigned[0].FullName)
          if ($original.Length -ne $patch.unsigned_bytes) { throw 'Unsigned artifact size mismatch' }
          $optional = [BitConverter]::ToInt32($original, 0x3c) + 24
          $magic = [BitConverter]::ToUInt16($original, $optional)
          if ($magic -notin @(0x10b, 0x20b)) { throw 'Invalid PE optional header' }
          $security = $optional + $(if ($magic -eq 0x10b) { 96 } else { 112 }) + 32
          if ($patch.segments.Count -ne 2 -or $patch.segments[0].offset -ne ($optional + 64) -or $patch.segments[1].offset -ne $security) { throw 'Unexpected signature patch ranges' }
          $trailer = [Convert]::FromBase64String($patch.trailer_base64)
          $reconstructed = [byte[]]::new($original.Length + $trailer.Length)
          [Array]::Copy($original, $reconstructed, $original.Length)
          for ($index = 0; $index -lt 2; $index++) {
            $segment = $patch.segments[$index]
            $value = [Convert]::FromBase64String($segment.base64)
            $length = if ($index -eq 0) { 4 } else { 8 }
            if ($value.Length -ne $length) { throw 'Unexpected signature patch length' }
            [Array]::Copy($value, 0, $reconstructed, [int]$segment.offset, $length)
          }
          [Array]::Copy($trailer, 0, $reconstructed, $original.Length, $trailer.Length)
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'fengwo-1.0.11.exe'), $reconstructed)
          $signatureEvidence = @()
          foreach ($version in @('1.0.10', '1.0.11')) {
            $path = Join-Path $env:RUNNER_TEMP ('fengwo-' + $version + '.exe')
            if ($version -eq '1.0.10') {
              Invoke-WebRequest -Uri ('https://picture.sansen.tech/' + $env:INSTALLER_FILENAME) -OutFile $path
            }
            $expected = if ($version -eq '1.0.10') { $env:BASELINE_HASH } else { $env:EXPECTED_HASH }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Installer hash mismatch' }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw 'Trusted timestamped Authenticode signature is required' }
            $certificateHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($signature.SignerCertificate.RawData)).ToLowerInvariant()
            if ($certificateHash -cne '27e3e2e77a0c5f3428eeb95a35825d4cf0c8710e760e9c8cb12b447d39603252') { throw 'Installer publisher certificate differs from 1.0.10' }
            $signatureEvidence += @{ version = $version; sha256 = $expected; status = [string]$signature.Status; signer_sha256 = $certificateHash; timestamp_subject = $signature.TimeStamperCertificate.Subject }
          }
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP 'signed-upgrade-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          $signatureEvidence | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidenceDirectory 'signature-evidence.json') -Encoding utf8NoBOM
      - name: Verify signed 1.0.10 to 1.0.11 overwrite upgrade
        run: |
          ./tooling/windows/test_installed_upgrade.ps1 -InstallerPath (Join-Path $env:RUNNER_TEMP 'fengwo-1.0.11.exe') -PreviousInstallerPath (Join-Path $env:RUNNER_TEMP 'fengwo-1.0.10.exe') -ExpectedPreviousVersion '1.0.10' -OutputDirectory (Join-Path $env:RUNNER_TEMP 'signed-upgrade-evidence')
      - name: Prepare tested identical signed package as an immutable CI artifact
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'fengwo-1.0.11.exe'
          if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_HASH) { throw 'Tested signed package changed before artifact creation' }
          $output = Join-Path $env:RUNNER_TEMP 'signed-package'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Copy-Item -LiteralPath $path -Destination (Join-Path $output $env:INSTALLER_FILENAME)
          @{ passed = $true; sha256 = $env:EXPECTED_HASH; sizeBytes = (Get-Item -LiteralPath $path).Length; architecture = $env:ARCHITECTURE; publication_performed = $false } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'signed-upgrade-evidence/package-artifact.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: fengwo-tested-signed-package-${{ matrix.architecture }}
          path: ${{ runner.temp }}/signed-package
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fengwo-signed-upgrade-${{ matrix.architecture }}
          path: ${{ runner.temp }}/signed-upgrade-evidence
          if-no-files-found: warn
