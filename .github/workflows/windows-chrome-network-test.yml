name: windows-chrome-network-test
on:
  push:
    branches:
      - codex/windows-chrome-network-test
permissions:
  contents: read
jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[native-only]') }}
    runs-on: windows-2022
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        proxy: [direct, upstream, current, current_no_ipv6]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe native Windows networking and real Chrome online installer
        shell: powershell
        run: ./tooling/windows/test_chrome_network.ps1 -Mode '${{ matrix.proxy }}' -OutputDirectory "$env:RUNNER_TEMP/chrome-network"
      - name: Validate read-only diagnostic collector on PowerShell 5.1
        if: always()
        shell: powershell
        run: ./tooling/windows/test_chrome_diagnostics.ps1 -RunCollector
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-network-${{ matrix.proxy }}
          path: ${{ runner.temp }}/chrome-network
          retention-days: 7
  native-edges:
    if: ${{ contains(github.event.head_commit.message, '[native-only]') }}
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify IPv6 bracket syntax and disabled proxy residue
        shell: powershell
        run: ./tooling/windows/test_chrome_native_edge_cases.ps1 -OutputDirectory "$env:RUNNER_TEMP/chrome-native-edges"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-native-edges
          path: ${{ runner.temp }}/chrome-native-edges
          retention-days: 7
