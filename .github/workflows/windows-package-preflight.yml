name: fengwo-windows-package-preflight

on:
  push:
    tags:
      - 'fengwo-ci-preflight-windows-*'

jobs:
  preflight:
    runs-on: windows-2022
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify JSON targets and version compatibility
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedMajor = if ('${{ matrix.shell }}' -eq 'powershell') { 5 } else { 7 }
          if ($PSVersionTable.PSVersion.Major -ne $expectedMajor) { throw 'Wrong PowerShell runtime' }
          foreach ($count in @(3, 5, 6)) {
            $targets = @(1..$count | ForEach-Object { "https://endpoint$_.example.com/config" })
            $fixture = Join-Path $env:RUNNER_TEMP "targets-$count.json"
            [IO.File]::WriteAllText($fixture, ($targets | ConvertTo-Json))
            [string[]]$expectedTargets = Get-Content $fixture -Raw | ConvertFrom-Json
            $report = [pscustomobject]@{ endpoints = @($targets | ForEach-Object { [pscustomobject]@{ url = $_ } }) }
            $actualTargets = @($report.endpoints | ForEach-Object { $_.url })
            if ($expectedTargets.Count -ne $count) { throw 'JSON targets are nested or truncated' }
            if ($expectedTargets.Count -lt 3 -or $actualTargets.Count -ne $expectedTargets.Count) { throw 'Collector did not cover every verified public endpoint' }
            if (@(Compare-Object -ReferenceObject $expectedTargets -DifferenceObject $actualTargets -CaseSensitive).Count -ne 0) { throw 'Collector public endpoint URLs do not match the verified targets' }
            $changedTargets = @($actualTargets)
            $changedTargets[0] = 'https://unexpected.example.com/config'
            if (@(Compare-Object -ReferenceObject $expectedTargets -DifferenceObject $changedTargets -CaseSensitive).Count -eq 0) { throw 'Different target URLs were accepted' }
          }
          foreach ($path in @(Get-ChildItem tooling/windows -Filter '*.ps1' -File)) {
            $tokens = $null
            $parseErrors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse errors: $($path.Name)" }
          }
          $previousVersionCore = ('1.0.8' -split '\+')[0]
          $expectedVersionCore = ('1.0.8+16' -split '\+')[0]
          if ([version]$previousVersionCore -gt [version]$expectedVersionCore) { throw 'Same-version overwrite baseline rejected' }
          [ordered]@{ powershell_version = $PSVersionTable.PSVersion.ToString(); tested_target_counts = @(3, 5, 6); url_mismatch_rejected = $true; windows_scripts_parse = $true; same_version_build_overwrite = $true } | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'preflight.json') -Encoding utf8
      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-preflight-${{ matrix.shell }}
          path: ${{ runner.temp }}/preflight.json
          if-no-files-found: error
