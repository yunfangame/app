name: fengwo-windows-arm64-existing-package-diagnostics
run-name: ARM64 diagnostic reuse ${{ inputs.built_run_id }} · ${{ github.sha }}

on:
  push:
    branches:
      - codex/windows-arm64-compat
    paths:
      - .github/workflows/verify-windows-arm64-existing-package.yml
  workflow_dispatch:
    inputs:
      built_run_id:
        description: Completed ARM64 build run containing diagnostics and verification artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      FENGWO_PROXY_MUTATING_TEST: '1'
      FENGWO_BUILT_RUN_ID: ${{ inputs.built_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify the native administrator runner and select Visual Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FENGWO_REUSED_PACKAGE = Join-Path $env:RUNNER_TEMP 'arm64-reused-package'
          $env:FENGWO_REUSE_EVIDENCE = Join-Path $env:RUNNER_TEMP 'arm64-existing-package-evidence'
          ('FENGWO_REUSED_PACKAGE=' + $env:FENGWO_REUSED_PACKAGE) | Add-Content -LiteralPath $env:GITHUB_ENV
          ('FENGWO_REUSE_EVIDENCE=' + $env:FENGWO_REUSE_EVIDENCE) | Add-Content -LiteralPath $env:GITHUB_ENV
          if ($env:FENGWO_BUILT_RUN_ID -cnotmatch '\A[1-9][0-9]*\z') { throw 'built_run_id must be a positive workflow run ID' }
          . ./tooling/windows/arm64/common.ps1
          $environment = Assert-FwArmRunner
          Assert-FwArmProcess $PID
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'Native PowerShell 7 is required' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try {
            if (-not ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'The isolated verification requires administrator privileges' }
          } finally { $identity.Dispose() }
          [void][IO.Directory]::CreateDirectory($env:FENGWO_REUSE_EVIDENCE)
          Save-FwArmEvidence (Join-Path $env:FENGWO_REUSE_EVIDENCE 'environment.json') $environment
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installations = @(& $vswhere -latest -products '*' -format json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $installations.Count -eq 0) { throw 'Visual Studio is unavailable' }
          $installation = $installations[0]
          $major = ([version]$installation.installationVersion).Major
          $generator = switch ($major) { 17 { 'Visual Studio 17 2022' }; 18 { 'Visual Studio 18 2026' }; default { throw 'Unsupported Visual Studio generator' } }
          ('FENGWO_ARM64_CMAKE_GENERATOR=' + $generator) | Add-Content -LiteralPath $env:GITHUB_ENV
          $sourceFiles = @(git ls-files -- .github/workflows/verify-windows-arm64-existing-package.yml tooling/windows tooling/verify_windows_title.ps1 windows/packaging)
          if ($LASTEXITCODE -ne 0 -or $sourceFiles.Count -eq 0) { throw 'Verification source files could not be enumerated' }
          $sourceManifest = @($sourceFiles | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() } })
          Save-FwArmEvidence (Join-Path $env:FENGWO_REUSE_EVIDENCE 'verification-source-manifest.json') ([ordered]@{ verification_source_sha = $env:GITHUB_SHA; files = $sourceManifest })
          Save-FwArmEvidence (Join-Path $env:FENGWO_REUSE_EVIDENCE 'compiler.json') ([ordered]@{ generator = $generator; installation_version = $installation.installationVersion; installation_path = $installation.installationPath; cmake = (& cmake --version | Out-String).Trim() })
          if ($LASTEXITCODE -ne 0) { throw 'CMake is unavailable' }
      - name: Download the existing installer and native bundle
        uses: actions/download-artifact@v4
        with:
          name: fengwo-windows-arm64-diagnostics
          github-token: ${{ github.token }}
          run-id: ${{ inputs.built_run_id }}
          path: ${{ runner.temp }}/arm64-reused-package
      - name: Download the original build verification evidence
        uses: actions/download-artifact@v4
        with:
          name: fengwo-windows-arm64-verification
          github-token: ${{ github.token }}
          run-id: ${{ inputs.built_run_id }}
          path: ${{ runner.temp }}/arm64-existing-package-evidence/built
      - name: Verify the reused package provenance and native payload
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tooling/windows/arm64/common.ps1
          $builtEvidence = Join-Path $env:FENGWO_REUSE_EVIDENCE 'built'
          $sourceManifestPath = Join-Path $builtEvidence 'source-manifest.json'
          $builtPackagePath = Join-Path $builtEvidence 'package/package.json'
          $builtBundlePath = Join-Path $builtEvidence 'package/bundle-verification.json'
          $sourceManifest = Get-Content -LiteralPath $sourceManifestPath -Raw | ConvertFrom-Json
          $builtPackage = Get-Content -LiteralPath $builtPackagePath -Raw | ConvertFrom-Json
          $builtBundle = Get-Content -LiteralPath $builtBundlePath -Raw | ConvertFrom-Json
          $headers = @{ Authorization = ('Bearer ' + $env:GH_TOKEN); Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $builtRun = Invoke-RestMethod -Uri ($env:GITHUB_API_URL + '/repos/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:FENGWO_BUILT_RUN_ID) -Headers $headers -TimeoutSec 30
          if ([string]$builtRun.id -cne $env:FENGWO_BUILT_RUN_ID -or $builtRun.status -cne 'completed' -or $builtRun.path -cne '.github/workflows/package-windows-arm64.yml' -or $builtRun.head_repository.full_name -cne $env:GITHUB_REPOSITORY) { throw 'The artifact does not belong to a completed native package build in this repository' }
          if ($sourceManifest.source_sha -cnotmatch '\A[a-f0-9]{40}\z' -or $sourceManifest.source_sha -cne $builtRun.head_sha -or @($sourceManifest.files).Count -eq 0) { throw 'The built source manifest does not match the selected workflow run commit' }
          if ($builtPackage.architecture -cne 'arm64' -or $builtPackage.version -cne '1.0.8' -or $builtBundle.passed -ne $true) { throw 'The original package did not pass its ARM64 payload verification' }
          $installer = Get-Item -LiteralPath (Join-Path $env:FENGWO_REUSED_PACKAGE 'dist/fengwo-windows-arm64-setup.exe')
          $bundle = Join-Path $env:FENGWO_REUSED_PACKAGE 'build/windows/arm64/runner/Release'
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($builtPackage.installer.sha256 -cnotmatch '\A[a-f0-9]{64}\z' -or $installerHash -cne $builtPackage.installer.sha256 -or $installer.Length -ne $builtPackage.installer.bytes) { throw 'The reused installer bytes or SHA256 differ from the original build evidence' }
          Save-FwArmEvidence (Join-Path $env:FENGWO_REUSE_EVIDENCE 'provenance.json') ([ordered]@{ diagnostic_only = $true; final_release_verified = $false; built_run_id = $env:FENGWO_BUILT_RUN_ID; package_build_sha = $builtRun.head_sha; package_build_url = $builtRun.html_url; package_build_conclusion = $builtRun.conclusion; verification_run_id = $env:GITHUB_RUN_ID; verification_source_sha = $env:GITHUB_SHA; installer_name = $installer.Name; installer_bytes = $installer.Length; installer_sha256 = $installerHash; built_source_manifest_sha256 = (Get-FileHash -LiteralPath $sourceManifestPath -Algorithm SHA256).Hash.ToLowerInvariant(); built_package_evidence_sha256 = (Get-FileHash -LiteralPath $builtPackagePath -Algorithm SHA256).Hash.ToLowerInvariant(); verification_source_manifest_sha256 = (Get-FileHash -LiteralPath (Join-Path $env:FENGWO_REUSE_EVIDENCE 'verification-source-manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant() })
          ./tooling/windows/verify_vc_runtime_bundle.ps1 -Architecture arm64 -BundleDirectory $bundle
          ./tooling/windows/arm64/verify_bundle.ps1 -BundleDirectory $bundle -InstallerPath $installer.FullName -EvidenceDirectory (Join-Path $env:FENGWO_REUSE_EVIDENCE 'package')
          $verifiedPackage = Get-Content -LiteralPath (Join-Path $env:FENGWO_REUSE_EVIDENCE 'package/package.json') -Raw | ConvertFrom-Json
          foreach ($group in @('payload', 'managed_architecture_independent', 'separate_runtime_bootstrappers')) {
            $expected = @($builtPackage.$group | ForEach-Object { [ordered]@{ path = $(if ($group -ceq 'separate_runtime_bootstrappers') { [IO.Path]::GetFileName($_.path) } else { $_.path }); sha256 = $_.sha256; bytes = $_.bytes; machine = $_.machine } } | Sort-Object path)
            $actual = @($verifiedPackage.$group | ForEach-Object { [ordered]@{ path = $(if ($group -ceq 'separate_runtime_bootstrappers') { [IO.Path]::GetFileName($_.path) } else { $_.path }); sha256 = $_.sha256; bytes = $_.bytes; machine = $_.machine } } | Sort-Object path)
            if (($expected | ConvertTo-Json -Depth 5 -Compress) -cne ($actual | ConvertTo-Json -Depth 5 -Compress)) { throw ('The reused bundle differs from the built package evidence: ' + $group) }
          }
          if ($verifiedPackage.core_manifest_sha256 -cne $builtPackage.core_manifest_sha256) { throw 'The reused Core manifest differs from its original build evidence' }
      - name: Verify FlClash coexistence across install start overwrite and uninstall
        id: coexistence
        shell: pwsh
        timeout-minutes: 15
        run: |
          ./tooling/windows/arm64/test_flclash_coexistence.ps1 -InstallerPath (Join-Path $env:FENGWO_REUSED_PACKAGE 'dist/fengwo-windows-arm64-setup.exe') -EvidenceDirectory (Join-Path $env:FENGWO_REUSE_EVIDENCE 'coexistence')
      - name: Verify legacy branded Helper ownership and installation discovery
        id: legacy
        shell: pwsh
        timeout-minutes: 10
        run: |
          ./tooling/windows/arm64/test_legacy_install_cleanup.ps1 -BundleDirectory (Join-Path $env:FENGWO_REUSED_PACKAGE 'build/windows/arm64/runner/Release') -EvidenceDirectory (Join-Path $env:FENGWO_REUSE_EVIDENCE 'legacy-ownership')
      - name: Verify native named-pipe Helper Core and Wintun adapter
        id: runtime
        shell: pwsh
        timeout-minutes: 10
        run: |
          ./tooling/windows/arm64/test_core_runtime.ps1 -BundleDirectory (Join-Path $env:FENGWO_REUSED_PACKAGE 'build/windows/arm64/runner/Release') -EvidenceDirectory (Join-Path $env:FENGWO_REUSE_EVIDENCE 'core-runtime')
      - name: Verify installed overwrite and native application launch
        id: installation
        shell: pwsh
        timeout-minutes: 15
        run: |
          ./tooling/windows/arm64/test_installed_package.ps1 -InstallerPath (Join-Path $env:FENGWO_REUSED_PACKAGE 'dist/fengwo-windows-arm64-setup.exe') -EvidenceDirectory (Join-Path $env:FENGWO_REUSE_EVIDENCE 'installation')
      - name: Verify native Helper repair and service overwrite
        id: helper
        shell: pwsh
        timeout-minutes: 10
        run: |
          ./tooling/windows/test_helper_service_repair.ps1 -InstallerPath (Join-Path $env:FENGWO_REUSED_PACKAGE 'dist/fengwo-windows-arm64-setup.exe') -OutputDirectory (Join-Path $env:FENGWO_REUSE_EVIDENCE 'helper-repair')
      - name: Record diagnostic-only verification outcomes
        if: always()
        shell: pwsh
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          COEXISTENCE_OUTCOME: ${{ steps.coexistence.outcome }}
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          INSTALLATION_OUTCOME: ${{ steps.installation.outcome }}
          HELPER_OUTCOME: ${{ steps.helper.outcome }}
        run: |
          $env:FENGWO_REUSE_EVIDENCE = Join-Path $env:RUNNER_TEMP 'arm64-existing-package-evidence'
          [void][IO.Directory]::CreateDirectory($env:FENGWO_REUSE_EVIDENCE)
          $outcomes = [ordered]@{ package = $env:PACKAGE_OUTCOME; coexistence = $env:COEXISTENCE_OUTCOME; legacy = $env:LEGACY_OUTCOME; runtime = $env:RUNTIME_OUTCOME; installation = $env:INSTALLATION_OUTCOME; helper = $env:HELPER_OUTCOME }
          $passed = @($outcomes.Values | Where-Object { $_ -cne 'success' }).Count -eq 0
          $result = [ordered]@{ diagnostic_only = $true; final_release_verified = $false; all_existing_harnesses_passed = $passed; built_run_id = $env:FENGWO_BUILT_RUN_ID; verification_run_id = $env:GITHUB_RUN_ID; verification_source_sha = $env:GITHUB_SHA; outcomes = $outcomes; fresh_build_required_for_final_acceptance = $true }
          [IO.File]::WriteAllText((Join-Path $env:FENGWO_REUSE_EVIDENCE 'diagnostic-summary.json'), ($result | ConvertTo-Json -Depth 6), [Text.UTF8Encoding]::new($false))
      - name: Upload diagnostic verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-windows-arm64-existing-package-verification
          path: ${{ runner.temp }}/arm64-existing-package-evidence
          if-no-files-found: error
          retention-days: 7
