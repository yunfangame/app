name: fengwo-windows-arm64-bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-arm64-compat
    paths:
      - .github/workflows/windows-arm64-bootstrap.yml
      - tooling/windows/arm64/common.ps1
      - tooling/windows/arm64/prepare_flutter.ps1

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap pinned native ARM64 Dart and Flutter
        shell: pwsh
        run: |
          ./tooling/windows/arm64/prepare_flutter.ps1 -SdkDirectory (Join-Path $env:RUNNER_TEMP 'flutter-arm64-3.44.4') -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'arm64-bootstrap-evidence')
      - name: Record native build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter doctor -v | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'arm64-bootstrap-evidence/flutter-doctor.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Flutter doctor failed' }
          $tools = [ordered]@{}
          foreach ($name in @('git', 'go', 'rustc', 'cargo', 'cmake', 'iscc')) {
            $command = Get-Command $name -ErrorAction SilentlyContinue
            $tools[$name] = if ($command) { $command.Source } else { $null }
          }
          . ./tooling/windows/arm64/common.ps1
          Save-FwArmEvidence (Join-Path $env:RUNNER_TEMP 'arm64-bootstrap-evidence/tools.json') $tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fengwo-arm64-bootstrap-evidence
          path: ${{ runner.temp }}/arm64-bootstrap-evidence
          if-no-files-found: error
          retention-days: 14
