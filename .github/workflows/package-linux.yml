name: fengwo-linux-package

on:
  push:
    branches:
      - 'codex/linux-upstream-0897-port'
    tags:
      - 'fengwo-package-linux-*'

permissions:
  contents: read

jobs:
  package:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-22.04
            deb_arch: amd64
            elf_machine: 'Advanced Micro Devices X86-64'
            webkit_build_package: libwebkit2gtk-4.0-dev
            webkit_runtime_package: libwebkit2gtk-4.0-37
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter (amd64)
        if: matrix.arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Prepare build keys
        env:
          AES_KEY: ${{ secrets.REMOTE_CONFIG_AES_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.REMOTE_CONFIG_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "$AES_KEY"
          test -n "$SIGNING_PUBLIC_KEY"
          mkdir -p tooling/remote_config
          jq -n \
            --arg aesKey "$AES_KEY" \
            --arg signingPublicKey "$SIGNING_PUBLIC_KEY" \
            '{aesKey: $aesKey, signingPublicKey: $signingPublicKey}' \
            > tooling/remote_config/keys.json

      - name: Get dependencies
        run: flutter pub get

      - name: Apply pinned Core patches
        run: |
          (cd plugins/setup/buildkit/build_tool && dart pub get)
          dart tooling/apply_core_patches.dart

      - name: Validate Linux Helper and tray
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo test --manifest-path services/helper/Cargo.toml --locked
          (
            cd plugins/tray
            flutter pub get
            flutter analyze --no-fatal-infos
            flutter test --no-pub --reporter expanded
          )
          (
            cd plugins/setup/buildkit/build_tool
            dart analyze
            dart test
          )

      - name: Install Linux webview build dependency
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          WEBKIT_BUILD_PACKAGE: ${{ matrix.webkit_build_package }}
          WEBKIT_RUNTIME_PACKAGE: ${{ matrix.webkit_runtime_package }}
        run: |
          sudo apt-get update
          sudo apt-get install -y "$WEBKIT_BUILD_PACKAGE"
          if [ "$TARGET_ARCH" = "amd64" ]; then
            plugin_cmake="$(find "$HOME/.pub-cache" -path '*/webview_all_linux-*/linux/CMakeLists.txt' -print -quit)"
            test -n "$plugin_cmake"
            plugin_root="$(dirname "$(dirname "$plugin_cmake")")"
            (
              cd "$plugin_root"
              if ! git apply --reverse --check --recount "$GITHUB_WORKSPACE/tooling/linux/webview_all_linux_soup2.patch" 2>/dev/null; then
                git apply --check --recount "$GITHUB_WORKSPACE/tooling/linux/webview_all_linux_soup2.patch"
                git apply --recount "$GITHUB_WORKSPACE/tooling/linux/webview_all_linux_soup2.patch"
              fi
            )
            grep -q 'webkit2gtk-4.0' "$plugin_cmake"
          fi
          sed -i "/  - libsecret-1-0/a\\  - $WEBKIT_RUNTIME_PACKAGE" linux/packaging/deb/make_config.yaml
          grep -q "$WEBKIT_RUNTIME_PACKAGE" linux/packaging/deb/make_config.yaml

      - name: Test full application and Linux packaging contracts
        run: |
          flutter analyze --no-pub --fatal-infos
          flutter test --no-pub --reporter expanded
          (
            cd core
            CGO_ENABLED=0 go test .
            CGO_ENABLED=0 go vet .
          )

      - name: Package stable Linux release
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          dart setup.dart linux --env stable --targets deb -v

      - name: Verify Linux package
        env:
          EXPECTED_DEB_ARCH: ${{ matrix.deb_arch }}
          EXPECTED_ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          package="$(find dist -maxdepth 1 -type f -name '*linux*.deb' -print -quit)"
          test -n "$package"
          test "$(dpkg-deb -f "$package" Architecture)" = "$EXPECTED_DEB_ARCH"
          mkdir verify-linux
          dpkg-deb -x "$package" verify-linux
          app="$(find verify-linux -type f -name FlClash -print -quit)"
          core="$(find verify-linux -type f -name FlClashCore -print -quit)"
          helper="$(find verify-linux -type f -name FlClashHelperService -print -quit)"
          test -n "$app"
          test -n "$core"
          test -n "$helper"
          test -x "$helper"
          manifest="$(dirname "$core")/manifest.json"
          test "$(jq -r .coreSha256 "$manifest")" = "$(sha256sum "$core" | cut -d ' ' -f 1)"
          test "$(readelf -h "$helper" | awk -F: '/Machine:/ {sub(/^[[:space:]]+/, "", $2); print $2}')" = "$EXPECTED_ELF_MACHINE"
          test "$(readelf -h "$app" | awk -F: '/Machine:/ {sub(/^[[:space:]]+/, "", $2); print $2}')" = "$EXPECTED_ELF_MACHINE"
          test "$(readelf -h "$core" | awk -F: '/Machine:/ {sub(/^[[:space:]]+/, "", $2); print $2}')" = "$EXPECTED_ELF_MACHINE"
          dpkg-deb --info "$package" >/dev/null
          test -x dist/fengwo-linux-preflight.sh
          bash -n dist/fengwo-linux-preflight.sh
          cp tooling/linux/README.md dist/README-linux.md
          (cd dist && sha256sum ./*.deb > SHA256SUMS)

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/fengwo-linux-preflight.sh
            dist/README-linux.md
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Install and smoke test on Ubuntu
        run: bash tooling/linux/ci-package-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-linux-amd64-smoke
          path: smoke-evidence/
          if-no-files-found: ignore

  debian-smoke:
    name: Debian 12 x64 package smoke
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fengwo-linux-amd64
          path: dist
      - name: Install and launch on Debian
        run: |
          mkdir -p smoke-evidence
          chmod 777 smoke-evidence
          docker run --rm -e GITHUB_ACTIONS=true \
            -v "$PWD:/work:ro" -v "$PWD/smoke-evidence:/evidence" \
            debian:12 bash /work/tooling/linux/ci-debian-smoke.sh
      - name: Upload Debian smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fengwo-linux-debian12-smoke
          path: smoke-evidence/
          if-no-files-found: ignore
