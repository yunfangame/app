def addMirrorRepositories = { repositories ->
    repositories.maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }
    repositories.maven { url = uri('https://maven.aliyun.com/repository/google') }
    repositories.maven { url = uri('https://maven.aliyun.com/repository/central') }
}

beforeSettings { settings ->
    settings.pluginManagement.repositories {
        addMirrorRepositories(delegate)
    }
    settings.dependencyResolutionManagement.repositories {
        addMirrorRepositories(delegate)
    }
}

// Flutter plugins may declare their own buildscript repositories. Put the
// reachable mirrors first without touching normal project repositories.
gradle.beforeProject { project ->
    addMirrorRepositories(project.buildscript.repositories)
}
